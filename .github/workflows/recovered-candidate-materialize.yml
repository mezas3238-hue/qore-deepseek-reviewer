name: QORE recovered candidate materializer
run-name: Materialize recovered candidate · ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths: ['recovered_candidate_materialize_requests/*.json']

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewer request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve and validate exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^recovered_candidate_materialize_requests/[^/]*\.json$' || true)
          test "${#FILES[@]}" -eq 1
          REQUEST="${FILES[0]}"
          jq -e '
            .schema == "qore-recovered-candidate-materialize-v1" and
            .repository == "mezas3238-hue/qore-core" and
            (.package_id | type == "string" and length > 0) and
            (.artifact_id | type == "number" and . > 0) and
            (.source_run_id | type == "number" and . > 0) and
            (.artifact_name | type == "string" and length > 0) and
            (.patch_filename == "harness-engineer-candidate.patch") and
            (.patch_sha256 | test("^[0-9a-f]{64}$")) and
            (.base_head | test("^[0-9a-f]{40}$")) and
            (.base_tree | test("^[0-9a-f]{40}$")) and
            (.target_branch | type == "string" and length > 0) and
            (.target_branch != "main") and (.target_branch != "master") and
            (.expected_changed_files | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)) and
            (.expected_changed_files | length == (unique | length)) and
            (.commit_subject | type == "string" and length > 0)
          ' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          for k in package_id artifact_id source_run_id artifact_name patch_filename patch_sha256 base_head base_tree target_branch commit_subject; do
            printf '%s=%s\n' "$k" "$(jq -r --arg k "$k" '.[$k]' "$REQUEST")" >> "$GITHUB_OUTPUT"
          done

      - name: Create exact qore-core write token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core
          permission-contents: write

      - name: Authenticate exact recovered artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
          PATCH_FILENAME: ${{ steps.request.outputs.patch_filename }}
          PATCH_SHA256: ${{ steps.request.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.expired' <<<"$META")" = false
          test "$(jq -r '.name' <<<"$META")" = "$ARTIFACT_NAME"
          test "$(jq -r '.workflow_run.id' <<<"$META")" = "$SOURCE_RUN_ID"
          ZIP="$RUNNER_TEMP/recovered-artifact.zip"
          DIR="$RUNNER_TEMP/recovered-artifact"
          mkdir -p "$DIR"
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          mapfile -t PATCHES < <(find "$DIR" -type f -name "$PATCH_FILENAME" -print)
          test "${#PATCHES[@]}" -eq 1
          PATCH="${PATCHES[0]}"
          test "$(sha256sum "$PATCH" | cut -d' ' -f1)" = "$PATCH_SHA256"
          cp "$PATCH" exact-recovered-candidate.patch
          printf 'artifact_id=%s\nsource_run_id=%s\npatch_sha256=%s\n' "$ARTIFACT_ID" "$SOURCE_RUN_ID" "$PATCH_SHA256" > recovered-artifact.binding

      - name: Checkout exact qore-core base
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: ${{ steps.request.outputs.base_head }}
          token: ${{ steps.app-token.outputs.token }}
          path: workspace/qore-core
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact patch and enforce exact scope
        working-directory: workspace/qore-core
        env:
          BASE_HEAD: ${{ steps.request.outputs.base_head }}
          BASE_TREE: ${{ steps.request.outputs.base_tree }}
          REQUEST_PATH: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          REQUEST="$GITHUB_WORKSPACE/$REQUEST_PATH"
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$(git show -s --format=%T HEAD)" = "$BASE_TREE"
          git diff --quiet HEAD -- && git diff --cached --quiet HEAD --
          git apply --check "$GITHUB_WORKSPACE/exact-recovered-candidate.patch"
          git apply "$GITHUB_WORKSPACE/exact-recovered-candidate.patch"
          git diff --check HEAD --
          git diff --name-only HEAD -- | sort > actual-files.txt
          jq -r '.expected_changed_files[]' "$REQUEST" | sort > expected-files.txt
          diff -u expected-files.txt actual-files.txt
          git diff --binary HEAD -- . > "$GITHUB_WORKSPACE/canonical-applied-candidate.patch"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qore-core development dependencies
        working-directory: workspace/qore-core
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run canonical FULL QORE quality gate
        working-directory: workspace/qore-core
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          COVERAGE_FILE: ${{ runner.temp }}/qore-recovered-materialize.coverage
        run: |
          set -euo pipefail
          git diff --check HEAD --
          ruff check . | tee "$GITHUB_WORKSPACE/materialize-ruff.log"
          mypy src tests | tee "$GITHUB_WORKSPACE/materialize-mypy.log"
          pytest --cov=src/qore --cov-report=term-missing | tee "$GITHUB_WORKSPACE/materialize-pytest.log"

      - name: Revalidate exact scope after FULL QG
        working-directory: workspace/qore-core
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          REQUEST="$GITHUB_WORKSPACE/$REQUEST_PATH"
          git diff --check HEAD --
          git diff --name-only HEAD -- | sort > actual-files-after-qg.txt
          jq -r '.expected_changed_files[]' "$REQUEST" | sort > expected-files-after-qg.txt
          diff -u expected-files-after-qg.txt actual-files-after-qg.txt

      - name: Commit exact candidate and create isolated branch
        working-directory: workspace/qore-core
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          PACKAGE_ID: ${{ steps.request.outputs.package_id }}
          COMMIT_SUBJECT: ${{ steps.request.outputs.commit_subject }}
          BASE_HEAD: ${{ steps.request.outputs.base_head }}
          REQUEST_PATH: ${{ steps.request.outputs.request }}
        run: |
          set -euo pipefail
          REQUEST="$GITHUB_WORKSPACE/$REQUEST_PATH"
          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "target branch already exists: ${TARGET_BRANCH}" >&2
            exit 74
          fi
          mapfile -t FILES < <(jq -r '.expected_changed_files[]' "$REQUEST")
          git add -- "${FILES[@]}"
          git diff --cached --name-only | sort > staged-files.txt
          jq -r '.expected_changed_files[]' "$REQUEST" | sort > expected-staged-files.txt
          diff -u expected-staged-files.txt staged-files.txt
          git config user.name 'QORE Recovery Materializer'
          git config user.email 'qore-recovery-materializer@users.noreply.github.com'
          git commit -m "$COMMIT_SUBJECT" -m "Recovered package: ${PACKAGE_ID}" -m "Base: ${BASE_HEAD}"
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git show -s --format=%T HEAD)"
          git push origin "${NEW_HEAD}:refs/heads/${TARGET_BRANCH}"
          printf '%s\n' "$NEW_HEAD" > "$GITHUB_WORKSPACE/materialized-head.txt"
          printf '%s\n' "$NEW_TREE" > "$GITHUB_WORKSPACE/materialized-tree.txt"
          printf '%s\n' "$TARGET_BRANCH" > "$GITHUB_WORKSPACE/materialized-branch.txt"

      - name: Upload materialization evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovered-materialization-${{ steps.request.outputs.package_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            recovered-artifact.binding
            exact-recovered-candidate.patch
            canonical-applied-candidate.patch
            materialize-ruff.log
            materialize-mypy.log
            materialize-pytest.log
            materialized-head.txt
            materialized-tree.txt
            materialized-branch.txt
