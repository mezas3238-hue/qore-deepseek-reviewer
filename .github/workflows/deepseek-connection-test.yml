name: DeepSeek connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest

    steps:
      - name: Create QORE Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core

      - name: Verify GitHub App access to qore-core
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          REPOSITORY="$(gh api repos/mezas3238-hue/qore-core --jq '.full_name')"
          PR_HEAD="$(gh api repos/mezas3238-hue/qore-core/pulls/437 --jq '.head.sha')"

          test "${REPOSITORY}" = "mezas3238-hue/qore-core"

          echo "Repository access: OK"
          echo "PR #437 HEAD: ${PR_HEAD}"

      - name: Verify DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --fail-with-body --silent --show-error \
              https://api.deepseek.com/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
              -d '{
                "model": "deepseek-v4-pro",
                "messages": [
                  {
                    "role": "system",
                    "content": "You are a connection test. Follow the user instruction exactly."
                  },
                  {
                    "role": "user",
                    "content": "Reply exactly with QORE_DEEPSEEK_OK"
                  }
                ],
                "thinking": {"type": "disabled"},
                "max_tokens": 32,
                "stream": false
              }'
          )"

          RESULT="$(printf '%s' "${RESPONSE}" | jq -r '.choices[0].message.content // empty')"

          if [[ "${RESULT}" != "QORE_DEEPSEEK_OK" ]]; then
            echo "DeepSeek returned an unexpected response."
            exit 1
          fi

          echo "DeepSeek API: OK"

      - name: Connection summary
        run: |
          echo "GitHub App authentication: OK"
          echo "qore-core access: OK"
          echo "DeepSeek V4 Pro API: OK"
          echo "QORE DeepSeek Reviewer connection: SUCCESS"
