name: Cancel duplicate DeepSeek R4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-duplicate-deepseek-r4.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep oldest DeepSeek review and cancel newer duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t RUN_IDS < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow deepseek-qore-review.yml \
              --status in_progress \
              --limit 10 \
              --json databaseId,createdAt \
              | jq -r 'sort_by(.createdAt) | .[].databaseId'
          )

          echo "In-progress DeepSeek review runs: ${RUN_IDS[*]:-none}"

          if [ "${#RUN_IDS[@]}" -ne 2 ]; then
            echo "Expected exactly two in-progress DeepSeek review runs; cancelling none."
            exit 1
          fi

          KEEP_ID="${RUN_IDS[0]}"
          CANCEL_ID="${RUN_IDS[1]}"

          echo "Keeping oldest run ${KEEP_ID}."
          echo "Cancelling duplicate newer run ${CANCEL_ID}."
          gh run cancel "$CANCEL_ID" --repo "$GITHUB_REPOSITORY"

          sleep 5
          gh run view "$KEEP_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion
          gh run view "$CANCEL_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion
