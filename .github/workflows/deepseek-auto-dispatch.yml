name: DeepSeek auto dispatch

on:
  push:
    branches:
      - main
    paths:
      - requests/current.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Validate request and dispatch review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REQUEST=requests/current.json
          jq -e '
            (.pr_number | type == "number") and
            (.package_id | type == "string" and length > 0) and
            (.expected_base | type == "string" and length == 40) and
            (.expected_head | type == "string" and length == 40) and
            (.expected_synthetic | type == "string" and length == 40) and
            (.review_mode | type == "string" and (. == "expert")) and
            (.prompt_path | type == "string" and length > 0)
          ' "$REQUEST" >/dev/null

          PR_NUMBER="$(jq -r '.pr_number' "$REQUEST")"
          PACKAGE_ID="$(jq -r '.package_id' "$REQUEST")"
          EXPECTED_BASE="$(jq -r '.expected_base' "$REQUEST")"
          EXPECTED_HEAD="$(jq -r '.expected_head' "$REQUEST")"
          EXPECTED_SYNTHETIC="$(jq -r '.expected_synthetic' "$REQUEST")"
          REVIEW_MODE="$(jq -r '.review_mode' "$REQUEST")"
          PROMPT_PATH="$(jq -r '.prompt_path' "$REQUEST")"

          echo "Dispatching ${PACKAGE_ID} for qore-core PR #${PR_NUMBER}."

          gh workflow run deepseek-qore-review.yml \
            --ref main \
            -f "pr_number=${PR_NUMBER}" \
            -f "package_id=${PACKAGE_ID}" \
            -f "expected_base=${EXPECTED_BASE}" \
            -f "expected_head=${EXPECTED_HEAD}" \
            -f "expected_synthetic=${EXPECTED_SYNTHETIC}" \
            -f "review_mode=${REVIEW_MODE}" \
            -f "prompt_path=${PROMPT_PATH}"

          echo "DeepSeek QORE review dispatch accepted."
