name: DeepSeek auto dispatch

on:
  push:
    branches:
      - main
    paths:
      - requests/current.json
      - benchmarks/current.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Validate request and dispatch review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CHANGED="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[].filename')"
          REQUEST_CHANGED=false
          BENCHMARK_CHANGED=false
          grep -qx 'requests/current.json' <<<"$CHANGED" && REQUEST_CHANGED=true || true
          grep -qx 'benchmarks/current.json' <<<"$CHANGED" && BENCHMARK_CHANGED=true || true

          if $REQUEST_CHANGED && $BENCHMARK_CHANGED; then
            echo "Refusing ambiguous push: review and benchmark requests changed together." >&2
            exit 1
          fi

          if $BENCHMARK_CHANGED; then
            REQUEST=benchmarks/current.json
            BENCHMARK_ONLY=true
          elif $REQUEST_CHANGED; then
            REQUEST=requests/current.json
            BENCHMARK_ONLY=false
          else
            echo "No dispatch request file changed." >&2
            exit 1
          fi

          EXPECTED_QG_SUMMARY="$(
            python3 scripts/qg_package_contract.py \
              request "$REQUEST" "$BENCHMARK_ONLY"
          )"

          PR_NUMBER="$(jq -r '.pr_number' "$REQUEST")"
          PACKAGE_ID="$(jq -r '.package_id' "$REQUEST")"
          EXPECTED_BASE="$(jq -r '.expected_base' "$REQUEST")"
          EXPECTED_HEAD="$(jq -r '.expected_head' "$REQUEST")"
          EXPECTED_SYNTHETIC="$(jq -r '.expected_synthetic' "$REQUEST")"
          REVIEW_MODE="$(jq -r '.review_mode' "$REQUEST")"
          PROMPT_PATH="$(jq -r '.prompt_path' "$REQUEST")"
          test -f "$PROMPT_PATH"

          if $BENCHMARK_ONLY; then
            echo "Dispatching isolated benchmark ${PACKAGE_ID} for qore-core PR #${PR_NUMBER}."
          else
            echo "Dispatching ${PACKAGE_ID} for qore-core PR #${PR_NUMBER}."
          fi

          gh workflow run deepseek-qore-review.yml \
            --ref main \
            -f "pr_number=${PR_NUMBER}" \
            -f "package_id=${PACKAGE_ID}" \
            -f "expected_base=${EXPECTED_BASE}" \
            -f "expected_head=${EXPECTED_HEAD}" \
            -f "expected_synthetic=${EXPECTED_SYNTHETIC}" \
            -f "expected_qg_summary=${EXPECTED_QG_SUMMARY}" \
            -f "review_mode=${REVIEW_MODE}" \
            -f "prompt_path=${PROMPT_PATH}" \
            -f "benchmark_only=${BENCHMARK_ONLY}"

          echo "DeepSeek workflow dispatch accepted; benchmark_only=${BENCHMARK_ONLY}."
