name: DeepSeek auto dispatch

on:
  push:
    branches:
      - main
    paths:
      - requests/current.json
      - benchmarks/current.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Validate request and dispatch review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CHANGED="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[].filename')"
          REQUEST_CHANGED=false
          BENCHMARK_CHANGED=false
          grep -qx 'requests/current.json' <<<"$CHANGED" && REQUEST_CHANGED=true || true
          grep -qx 'benchmarks/current.json' <<<"$CHANGED" && BENCHMARK_CHANGED=true || true

          if $REQUEST_CHANGED && $BENCHMARK_CHANGED; then
            echo "Refusing ambiguous push: review and benchmark requests changed together." >&2
            exit 1
          fi

          if $BENCHMARK_CHANGED; then
            REQUEST=benchmarks/current.json
            BENCHMARK_ONLY=true
          elif $REQUEST_CHANGED; then
            REQUEST=requests/current.json
            BENCHMARK_ONLY=false
          else
            echo "No dispatch request file changed." >&2
            exit 1
          fi

          jq -e '
            def positive_integer:
              type == "number" and . >= 1 and floor == .;
            def nonnegative_integer:
              type == "number" and . >= 0 and floor == .;
            (.pr_number | positive_integer) and
            (.package_id | type == "string" and length > 0) and
            (.expected_base | type == "string" and test("^[0-9a-f]{40}$")) and
            (.expected_head | type == "string" and test("^[0-9a-f]{40}$")) and
            (.expected_synthetic | type == "string" and test("^[0-9a-f]{40}$")) and
            (.review_mode | type == "string" and (. == "expert" or . == "coder")) and
            (.prompt_path | type == "string" and startswith("prompts/") and length > 8) and
            (.qg_summary | type == "object") and
            ((.qg_summary | keys) == [
              "coverage_missed_statements",
              "coverage_percent",
              "coverage_total_statements",
              "job_id",
              "mypy_source_files",
              "pytest_collected",
              "pytest_passed",
              "pytest_warnings",
              "ruff_passed",
              "run_id"
            ]) and
            (.qg_summary.run_id | positive_integer) and
            (.qg_summary.job_id | positive_integer) and
            (.qg_summary.ruff_passed == true) and
            (.qg_summary.mypy_source_files | positive_integer) and
            (.qg_summary.pytest_collected | positive_integer) and
            (.qg_summary.pytest_passed | positive_integer) and
            (.qg_summary.pytest_warnings | nonnegative_integer) and
            (.qg_summary.coverage_total_statements | positive_integer) and
            (.qg_summary.coverage_missed_statements | nonnegative_integer) and
            (.qg_summary.coverage_percent | nonnegative_integer and . <= 100) and
            (.qg_summary.pytest_collected == .qg_summary.pytest_passed) and
            (.qg_summary.coverage_missed_statements <= .qg_summary.coverage_total_statements)
          ' "$REQUEST" >/dev/null

          PR_NUMBER="$(jq -r '.pr_number' "$REQUEST")"
          PACKAGE_ID="$(jq -r '.package_id' "$REQUEST")"
          EXPECTED_BASE="$(jq -r '.expected_base' "$REQUEST")"
          EXPECTED_HEAD="$(jq -r '.expected_head' "$REQUEST")"
          EXPECTED_SYNTHETIC="$(jq -r '.expected_synthetic' "$REQUEST")"
          REVIEW_MODE="$(jq -r '.review_mode' "$REQUEST")"
          PROMPT_PATH="$(jq -r '.prompt_path' "$REQUEST")"
          EXPECTED_QG_SUMMARY="$(jq -c '.qg_summary' "$REQUEST")"

          test -f "$PROMPT_PATH"

          if $BENCHMARK_ONLY; then
            case "$PACKAGE_ID" in
              BENCHMARK-*) ;;
              *) echo "Benchmark package_id must start with BENCHMARK-." >&2; exit 1 ;;
            esac
            echo "Dispatching isolated benchmark ${PACKAGE_ID} for qore-core PR #${PR_NUMBER}."
          else
            case "$PACKAGE_ID" in
              BENCHMARK-*) echo "Production review request cannot use BENCHMARK- package_id." >&2; exit 1 ;;
              *) ;;
            esac
            echo "Dispatching ${PACKAGE_ID} for qore-core PR #${PR_NUMBER}."
          fi

          gh workflow run deepseek-qore-review.yml \
            --ref main \
            -f "pr_number=${PR_NUMBER}" \
            -f "package_id=${PACKAGE_ID}" \
            -f "expected_base=${EXPECTED_BASE}" \
            -f "expected_head=${EXPECTED_HEAD}" \
            -f "expected_synthetic=${EXPECTED_SYNTHETIC}" \
            -f "expected_qg_summary=${EXPECTED_QG_SUMMARY}" \
            -f "review_mode=${REVIEW_MODE}" \
            -f "prompt_path=${PROMPT_PATH}" \
            -f "benchmark_only=${BENCHMARK_ONLY}"

          echo "DeepSeek workflow dispatch accepted; benchmark_only=${BENCHMARK_ONLY}."
