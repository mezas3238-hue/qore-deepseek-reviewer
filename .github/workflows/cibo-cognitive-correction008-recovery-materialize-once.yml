name: CIBO Cognitive Correction008 recovery materialize once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cibo-cognitive-correction008-recovery-materialize-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: cibo-cognitive-correction008-recovery-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Create qore-core installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core
          permission-contents: write

      - name: Checkout exact PR486 branch
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: agent/qore-cibo-cognitive-superarchitecture-001-independent-materialize
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate recovery artifact and exact PR binding
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: '486'
          EXPECTED_HEAD: 35e9ecace3f16dfd7b8845c60885d70283355dc6
          EXPECTED_TREE: f45adf718a7a4b75f6af062c0a254ab65f68baeb
          ARTIFACT_ID: '9944713923'
          EXPECTED_RUN_ID: '33882084234'
          EXPECTED_ARTIFACT_SHA256: bcf977eab4a92a877512fe97eb688df1e886197baf6175edae3dd572f8b9a753
          EXPECTED_PATCH_SHA256: 7f8c2a8c2a6820e49c2beca4ad25a37a96e6eddc5521d54d105fb4db2037be57
          EXPECTED_PACKAGE: HARNESS-ENGINEER-QORE-CIBO-COGNITIVE-EXPERT-R4-CORRECTION-008-INTERRUPTED-REVIEW-ROOT-FAMILY-CLOSURE-001
          TARGET_BRANCH: agent/qore-cibo-cognitive-superarchitecture-001-independent-materialize
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"

          PR="$(GH_TOKEN="$APP_TOKEN" gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$PR")" = open
          test "$(jq -r '.merged' <<<"$PR")" = false
          test "$(jq -r '.draft' <<<"$PR")" = true
          test "$(jq -r '.head.ref' <<<"$PR")" = "$TARGET_BRANCH"
          test "$(jq -r '.head.sha' <<<"$PR")" = "$EXPECTED_HEAD"

          META="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$META")" = "$EXPECTED_RUN_ID"
          test "$(jq -r '.expired' <<<"$META")" = false
          test "$(jq -r '.digest' <<<"$META")" = "sha256:${EXPECTED_ARTIFACT_SHA256}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/c008.zip
          test "$(sha256sum /tmp/c008.zip | awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA256"

          rm -rf /tmp/c008 /tmp/candidate
          mkdir -p /tmp/c008
          unzip -q /tmp/c008.zip -d /tmp/c008
          PATCH="$(find /tmp/c008 -type f -name 'harness-engineer-candidate.patch' -print -quit)"
          LANES="$(find /tmp/c008 -type f -name 'harness-engineer-lane-state.json' -print -quit)"
          OUTPUT="$(find /tmp/c008 -type f -name 'harness-engineer-output.md' -print -quit)"
          PACKAGE="$(find /tmp/c008 -type f -name 'harness-engineer-package.json' -print -quit)"
          CHECKPOINTS="$(find /tmp/c008 -type f -name 'harness-engineer-checkpoints.md' -print -quit)"
          test -n "$PATCH" && test -n "$LANES" && test -n "$OUTPUT" && test -n "$PACKAGE" && test -n "$CHECKPOINTS"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          test "$(jq -r '.package_id' "$PACKAGE")" = "$EXPECTED_PACKAGE"
          test "$(jq -r '.expected_start' "$PACKAGE")" = "$EXPECTED_HEAD"
          test "$(jq -r '.expected_tree' "$PACKAGE")" = "$EXPECTED_TREE"
          jq -e '.all_complete == true and .pending_lanes == [] and .blocked_lanes == [] and .completed_lanes == [1,2,3,4,5,6]' "$LANES" >/dev/null
          test "$(jq -r '.package_id' "$LANES")" = "$EXPECTED_PACKAGE"
          test "$(jq -r '.start' "$LANES")" = "$EXPECTED_HEAD"
          test "$(jq -r '.tree' "$LANES")" = "$EXPECTED_TREE"
          grep -Fq 'CANDIDATE READY — EXPERT R4 INTERRUPTED ROOT FAMILIES EXHAUSTED' "$OUTPUT"
          grep -Fq 'FULL QG green' "$CHECKPOINTS"
          grep -Fq '5592 passed' "$CHECKPOINTS"
          printf '%s\n' "$PATCH" > /tmp/c008-patch-path

      - name: Apply exact artifact patch and certify scope
        env:
          EXPECTED_HEAD: 35e9ecace3f16dfd7b8845c60885d70283355dc6
        run: |
          set -euo pipefail
          PATCH="$(cat /tmp/c008-patch-path)"
          git worktree add --detach /tmp/candidate "$EXPECTED_HEAD"
          git -C /tmp/candidate apply --check "$PATCH"
          git -C /tmp/candidate apply "$PATCH"
          git -C /tmp/candidate add -N --all
          git -C /tmp/candidate diff --check

          cat > /tmp/expected-files.txt <<'EOF'
          src/qore/infrastructure/cibo_cognitive_hypotheses.py
          src/qore/infrastructure/cibo_executive_brain.py
          src/qore/infrastructure/cibo_executive_deliberation.py
          src/qore/modules/cibo/cognitive_contracts.py
          tests/infrastructure/test_cibo_cognitive_hypotheses.py
          tests/infrastructure/test_cibo_executive_brain.py
          tests/modules/cibo/test_cibo_cognitive_contracts.py
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git -C /tmp/candidate diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 7
          test "$(git -C /tmp/candidate diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')" -eq 964

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact candidate development dependencies
        working-directory: /tmp/candidate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: External canonical FULL QORE quality gate
        working-directory: /tmp/candidate
        run: |
          set -euo pipefail
          git diff --check
          ruff check . | tee /tmp/c008-ruff.log
          mypy src tests | tee /tmp/c008-mypy.log
          pytest --cov=src/qore --cov-report=term-missing | tee /tmp/c008-pytest.log
          grep -Fq 'All checks passed!' /tmp/c008-ruff.log
          grep -Fq 'Success: no issues found' /tmp/c008-mypy.log
          grep -Eq '5592 passed' /tmp/c008-pytest.log

      - name: Create exact candidate commit and atomically advance PR486
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: '486'
          EXPECTED_HEAD: 35e9ecace3f16dfd7b8845c60885d70283355dc6
          TARGET_BRANCH: agent/qore-cibo-cognitive-superarchitecture-001-independent-materialize
        run: |
          set -euo pipefail
          git -C /tmp/candidate add --all
          git -C /tmp/candidate diff --cached --check
          CANDIDATE_TREE="$(git -C /tmp/candidate write-tree)"
          git config user.name qore-cognitive-materializer
          git config user.email qore-cognitive-materializer@users.noreply.github.com
          NEW_HEAD="$(printf '%s\n' 'Materialize CIBO Cognitive Correction 008 candidate' | git commit-tree "$CANDIDATE_TREE" -p "$EXPECTED_HEAD")"
          test "$(git rev-parse "$NEW_HEAD^")" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$NEW_HEAD^{tree}")" = "$CANDIDATE_TREE"

          PR="$(GH_TOKEN="$APP_TOKEN" gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          test "$(jq -r '.head.sha' <<<"$PR")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.ref' <<<"$PR")" = "$TARGET_BRANCH"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "${NEW_HEAD}:refs/heads/${TARGET_BRANCH}"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$NEW_HEAD"
          echo "NEW_HEAD=$NEW_HEAD"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"

# Trigger marker: Correction008 authenticated recovery.
# Trigger marker 2: execute authenticated recovery now.
