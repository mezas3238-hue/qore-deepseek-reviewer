name: DeepSeek Harness independent audit-repair certification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile deterministic controls
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/harness_large_batch_state.py \
            scripts/harness_resilient_runner.py \
            scripts/harness_resilient_runner_v3.py \
            scripts/harness_execution_budget.py \
            scripts/harness_internal_expert_gate.py \
            scripts/reviewer_resilient_runner.py \
            scripts/test_harness_large_batch_state.py \
            scripts/test_harness_dual_role_state.py \
            scripts/test_harness_resilient_runner.py \
            scripts/test_harness_internal_expert_gate.py \
            scripts/test_harness_terminal_markers.py \
            scripts/test_harness_cost_window.py \
            scripts/test_reviewer_resilient_runner.py

      - name: Run deterministic and adversarial behavior tests
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 test_harness_large_batch_state.py
          python3 test_harness_dual_role_state.py
          python3 test_harness_resilient_runner.py
          python3 test_harness_internal_expert_gate.py
          python3 test_harness_terminal_markers.py
          python3 test_harness_cost_window.py
          python3 test_reviewer_resilient_runner.py

      - name: Certify implementation role blindness
        run: |
          set -euo pipefail
          ENGINEER_PROMPT=harness/engineer/prompts/qore-harness-engineer-independent-v1.md
          SKILL=harness/skills/qore-engineer-authority/SKILL.md
          test -s "$ENGINEER_PROMPT"
          grep -q 'ENGINEERING_READY_FOR_HOST_HANDOFF' "$ENGINEER_PROMPT"
          grep -q 'six engineering lanes' "$ENGINEER_PROMPT"
          ! grep -q 'VALIDATION_FINDINGS' "$ENGINEER_PROMPT"
          ! grep -q 'Internal Expert' "$ENGINEER_PROMPT"
          grep -q 'downstream validation process is intentionally undisclosed' "$SKILL"
          ! grep -q 'VALIDATION_FINDINGS' "$SKILL"

      - name: Certify independent auditor-remediator authority
        run: |
          set -euo pipefail
          POLICY=harness/engineer/QORE-HARNESS-INDEPENDENT-AUDIT-REPAIR-POLICY-V2.md
          AUDITOR=harness/engineer/prompts/qore-harness-internal-expert-independent-v1.md
          test -s "$POLICY"
          test -s "$AUDITOR"
          grep -q 'ENGINEER DOES NOT PARTICIPATE AFTER AUDIT HANDOFF' "$POLICY"
          grep -q 'INTERNAL EXPERT MAY REPAIR ITS AUDIT FINDINGS DIRECTLY' "$POLICY"
          grep -q 'EVERY INTERNAL REPAIR REQUIRES A FULL FIVE-LANE RE-AUDIT BEFORE INTERNAL CLEAN' "$POLICY"
          grep -q 'Internal Expert uses five reviewer lanes' "$POLICY" || grep -q 'Internal Expert owns five reviewer lanes' "$POLICY"
          grep -q 'Do not return defects to the implementation role' "$AUDITOR"
          grep -q 'FULL five-lane audit' "$AUDITOR"
          grep -q 'qore.internal-expert.audit-repair.v2' "$AUDITOR"
          ! grep -q 'HARNESS ENGINEER' "$AUDITOR"
          ! grep -q 'VALIDATION_FINDINGS' "$AUDITOR"

      - name: Certify host-enforced one-way handoff and repair binding
        run: |
          set -euo pipefail
          RUNNER=scripts/harness_resilient_runner_v3.py
          GATE=scripts/harness_internal_expert_gate.py
          grep -q 'qore-harness-independent-audit-repair-runner-v3' "$RUNNER"
          grep -q 'implementation_package_context_shared_with_internal_expert' "$RUNNER"
          grep -q 'engineer_reentered_after_audit_handoff' "$RUNNER"
          grep -q 'internal_expert_can_repair' "$RUNNER"
          grep -q 'internal_expert_reaudits_after_repairs' "$RUNNER"
          grep -q 'ENGINEERING_SESSION_BUDGET_EXHAUSTED_RECOVERABLY' "$RUNNER"
          grep -q 'INTERNAL_EXPERT_SESSION_BUDGET_EXHAUSTED_RECOVERABLY' "$RUNNER"
          grep -q 'final_candidate_patch_sha256' "$GATE"
          grep -q 'post-repair full re-audit' "$GATE"
          grep -q 'Engineer improperly re-entered after audit handoff' "$GATE"

      - name: Certify deadline-safe execution budget
        run: |
          set -euo pipefail
          python3 scripts/harness_execution_budget.py \
            --job-timeout-minutes 240 \
            --runner-wall-seconds 9300 \
            --engineer-sessions 4 \
            --audit-sessions 2 \
            --session-timeout-seconds 1500 \
            --post-runner-reserve-seconds 4800 \
            --runner-grace-seconds 180 >/dev/null
          PYTHONPATH=scripts python3 - <<'PY'
          from harness_execution_budget import BudgetError, validate_budget
          try:
              validate_budget(
                  job_timeout_minutes=190,
                  runner_wall_seconds=25000,
                  engineer_sessions=12,
                  audit_sessions=1,
                  session_timeout_seconds=2100,
                  post_runner_reserve_seconds=1200,
                  runner_grace_seconds=180,
              )
          except BudgetError:
              pass
          else:
              raise AssertionError('historical unsafe budget must fail closed')
          PY

      - name: Certify V3 workflow and router
        run: |
          set -euo pipefail
          WF=.github/workflows/deepseek-harness-independent-audit-repair-v3.yml
          ROUTER=.github/workflows/deepseek-harness-engineer-auto-dispatch.yml
          test -s "$WF"
          grep -q 'Run deadline-safe Engineer then reserved Internal Expert audit-repair' "$WF"
          grep -q 'timeout-minutes: 240' "$WF"
          grep -q 'harness_execution_budget.py' "$WF"
          grep -q 'harness_resilient_runner_v3.py' "$WF"
          grep -q 'engineer-session-budget 4' "$WF"
          grep -q 'audit-session-budget 2' "$WF"
          grep -q 'wall-clock-budget-seconds 9300' "$WF"
          grep -q 'internal_expert_knows_engineer_identity == false' "$WF"
          grep -q 'engineer_reentered_after_audit_handoff == false' "$WF"
          ! grep -q 'QORE-HARNESS-INTERNAL-EXPERT-FALSIFICATION-V2' "$WF"
          ! grep -q 'MANDATORY INTERNAL EXPERT V2 PROTOCOL' "$WF"
          grep -q 'deepseek-harness-independent-audit-repair-v3.yml' "$ROUTER"
          grep -q 'Refusing duplicate Harness dispatch for package' "$ROUTER"
          grep -q 'Deadline-safe independent audit-repair Harness dispatch accepted' "$ROUTER"

      - name: Certify External Expert remains independent and resilient
        run: |
          set -euo pipefail
          grep -q 'reviewer_resilient_runner.py' .github/workflows/deepseek-qore-review.yml
          grep -q 'max-generations 4' .github/workflows/deepseek-qore-review.yml
          grep -q 'generation-timeout-seconds 1800' .github/workflows/deepseek-qore-review.yml
          grep -q 'LANE LAUNCHED != LANE COMPLETED' harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md
          grep -q 'VALIDATION BLOCKED' harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md
          grep -q 'REVIEWER_RECOVERY_GENERATIONS_EXHAUSTED' scripts/reviewer_resilient_runner.py
