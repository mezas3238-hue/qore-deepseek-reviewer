name: DeepSeek Harness large-batch resilience certification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile deterministic controls
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/harness_large_batch_state.py \
            scripts/harness_resilient_runner.py \
            scripts/test_harness_large_batch_state.py \
            scripts/test_harness_resilient_runner.py \
            scripts/test_harness_terminal_markers.py \
            scripts/test_harness_cost_window.py
      - name: Run adversarial state-machine and runner tests
        working-directory: scripts
        run: |
          set -euo pipefail
          python3 test_harness_large_batch_state.py
          python3 test_harness_resilient_runner.py
          python3 test_harness_terminal_markers.py
          python3 test_harness_cost_window.py
      - name: Certify Harness one-shot complete-delivery and six-subagent authority
        run: |
          set -euo pipefail
          grep -q 'PENDING LANE != BATCH FAILURE' docs/harness-large-batch-resilience-001.md
          grep -q 'ONE LANE INTERRUPTION != RESTART ALL LANES' docs/harness-large-batch-resilience-001.md
          grep -q 'DURABLE COMPLETED LANE != REPEATABLE WORK' docs/harness-large-batch-resilience-001.md
          grep -q 'RECOVERABLE MODEL EXIT != MATERIAL FAILURE' docs/harness-large-batch-resilience-001.md
          grep -q 'ONE WORK PACKAGE = ONE HARNESS DELIVERY' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'ONE DISPATCH -> ONE COMPLETE SOLUTION OR BLOCKED' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'NO NORMAL CORRECTION CHAIN' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'EXPERT PASS IS THE ACCEPTANCE TARGET OF EVERY HARNESS DELIVERY' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'HARNESS_QUALITY_FAILURE' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'FAMILY_MODEL' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'MATERIAL_GAP' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'Fresh post-implementation independent self-falsification' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'did NOT propose or implement the patch' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'QORE_LANE_STATE' harness/engineer/prompts/qore-harness-engineer-v2.md
          grep -q 'QORE_SUBAGENT_STATE' scripts/harness_large_batch_state.py
          grep -q 'all_subagents_complete' scripts/harness_large_batch_state.py
          grep -q 'subagent identity .* reused across lanes' scripts/harness_large_batch_state.py
          grep -q 'exactly six native subagent delegations' harness/skills/qore-engineer-authority/SKILL.md
          ! grep -q 'at most two useful subagent delegations' harness/skills/qore-engineer-authority/SKILL.md
      - name: Certify routing, recovery memory and cost-window fail-closed gates
        run: |
          set -euo pipefail
          grep -q 'deepseek-harness-engineer-resilient.yml' .github/workflows/deepseek-harness-engineer-auto-dispatch.yml
          grep -q '19:45' .github/workflows/deepseek-harness-engineer-auto-dispatch.yml
          grep -q 'harness_resilient_runner.py' .github/workflows/deepseek-harness-engineer-resilient.yml
          grep -q 'qore-harness-engineer-v2.md' .github/workflows/deepseek-harness-engineer-resilient.yml
          grep -q 'all_complete == true' .github/workflows/deepseek-harness-engineer-resilient.yml
          grep -q 'max-generations 4' .github/workflows/deepseek-harness-engineer-resilient.yml
          grep -q 'Require warm LSP cache before API spend' .github/workflows/deepseek-harness-engineer-resilient.yml
          grep -q 'deepseek-harness-engineer.yml deepseek-harness-engineer-resilient.yml' .github/workflows/deepseek-harness-engineer-auto-dispatch.yml
          grep -q 'deepseek-harness-engineer.yml deepseek-harness-engineer-resilient.yml' .github/workflows/deepseek-harness-engineer-resilient.yml
          grep -q 'HOST_RECOVERY_IMPORTED' scripts/harness_large_batch_state.py
          grep -q 'RECOVERY_REQUIRED' scripts/harness_large_batch_state.py
          grep -q 'completed_subagent_lanes' scripts/harness_large_batch_state.py
          grep -q 'America/Asuncion' scripts/harness_resilient_runner.py
          grep -q '21:25' scripts/harness_resilient_runner.py
          grep -q 'COST_WINDOW_CUTOFF_21_25_AMERICA_ASUNCION' scripts/harness_resilient_runner.py
          grep -q 'start_new_session=True' scripts/harness_resilient_runner.py
          grep -q 'os.killpg' scripts/harness_resilient_runner.py
