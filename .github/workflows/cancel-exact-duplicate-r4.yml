name: Cancel exact duplicate DeepSeek R4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-exact-duplicate-r4.yml

permissions:
  actions: write
  contents: write

jobs:
  cancel-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only exact newer duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: "32724205038"
          CANCEL_ID: "32724207602"
        run: |
          set -euo pipefail

          KEEP="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${KEEP_ID}")"
          DUP="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANCEL_ID}")"

          test "$(printf '%s' "$KEEP" | jq -r '.name')" = "DeepSeek QORE review"
          test "$(printf '%s' "$DUP" | jq -r '.name')" = "DeepSeek QORE review"
          test "$(printf '%s' "$KEEP" | jq -r '.event')" = "workflow_dispatch"
          test "$(printf '%s' "$DUP" | jq -r '.event')" = "workflow_dispatch"
          test "$(printf '%s' "$KEEP" | jq -r '.status')" = "in_progress"
          test "$(printf '%s' "$DUP" | jq -r '.status')" = "in_progress"

          echo "Keeping ${KEEP_ID}; cancelling exact duplicate ${CANCEL_ID}."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${CANCEL_ID}/cancel" >/dev/null

          sleep 5
          KEEP_AFTER="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${KEEP_ID}")"
          DUP_AFTER="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANCEL_ID}")"

          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson keep_id "$KEEP_ID" \
            --arg keep_status "$(printf '%s' "$KEEP_AFTER" | jq -r '.status')" \
            --arg keep_conclusion "$(printf '%s' "$KEEP_AFTER" | jq -r '.conclusion // ""')" \
            --argjson cancel_id "$CANCEL_ID" \
            --arg cancel_status "$(printf '%s' "$DUP_AFTER" | jq -r '.status')" \
            --arg cancel_conclusion "$(printf '%s' "$DUP_AFTER" | jq -r '.conclusion // ""')" \
            '{checked_at:$checked_at,keep:{id:$keep_id,status:$keep_status,conclusion:$keep_conclusion},cancelled:{id:$cancel_id,status:$cancel_status,conclusion:$cancel_conclusion}}' \
            > /tmp/deepseek-r4-cancel-result.json

          CONTENT="$(base64 -w0 /tmp/deepseek-r4-cancel-result.json)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/ops/deepseek-r4-cancel-result.json" \
            -f message='ops: record exact DeepSeek R4 cancellation' \
            -f content="$CONTENT" \
            -f branch=main >/dev/null
