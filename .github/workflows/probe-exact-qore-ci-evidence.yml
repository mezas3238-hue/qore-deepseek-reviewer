name: Probe exact QORE CI evidence

on:
  push:
    paths:
      - '.github/workflows/probe-exact-qore-ci-evidence.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create QORE Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core
      - name: Fetch and validate exact CI evidence without model call
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROMPT_PATH: ${{ github.workspace }}/prompts/qore-umi14-umi12-final-owner-recert-001-expert-r87-compact.md
          EXPECTED_SYNTHETIC: d55cee13735d1c50bb63cf43fb34e97385b8d138
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import deepseek_reviewer_compact_budgeted_v19 as v19
          evidence = v19._exact_qore_ci_evidence()
          assert '99111137157' in evidence
          assert '33256530716' in evidence
          assert 'All checks passed!' in evidence
          assert 'Success: no issues found in 740 source files' in evidence
          assert '4858 passed, 7 warnings' in evidence
          assert '87%' in evidence
          print('EXACT_QORE_CI_EVIDENCE_OK')
          PY
