name: Reviewer exact-QG free probes

on:
  pull_request:
    paths:
      - ".github/workflows/deepseek-auto-dispatch.yml"
      - ".github/workflows/deepseek-qore-review.yml"
      - ".github/workflows/probe-exact-qg-binding.yml"
      - "profiles/QORE-DEEPSEEK-V2.1.1-STABLE.json"
      - "scripts/deepseek_reviewer_v2_1_1_entrypoint.py"
      - "scripts/deepseek_reviewer_compact_budgeted_v19.py"
      - "scripts/deepseek_reviewer_compact_budgeted_v20.py"
      - "scripts/exact_qg_evidence.py"
      - "scripts/probe_exact_qg_binding.py"
      - "scripts/probe_stable_profile_governance.py"
      - "scripts/qg_package_contract.py"
      - "scripts/run_review_with_meter.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-qg-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Compile exact-QG reviewer modules
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/deepseek_reviewer_v2_1_1_entrypoint.py \
            scripts/deepseek_reviewer_compact_budgeted_v19.py \
            scripts/deepseek_reviewer_compact_budgeted_v20.py \
            scripts/exact_qg_evidence.py \
            scripts/probe_exact_qg_binding.py \
            scripts/probe_stable_profile_governance.py \
            scripts/qg_package_contract.py \
            scripts/run_review_with_meter.py

      - name: Run exact-QG and full-freeze regression probes
        run: |
          set -euo pipefail
          python3 scripts/probe_exact_qg_binding.py

      - name: Run stable profile governance probes
        run: |
          set -euo pipefail
          python3 scripts/probe_stable_profile_governance.py
