name: QORE orchestrator completion callback

on:
  workflow_run:
    workflows:
      - DeepSeek QORE review
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "recovery/orchestrator-completion-current.json"
  pull_request:
    paths:
      - ".github/workflows/qore-orchestrator-completion-callback.yml"
      - ".github/workflows/deepseek-qore-review.yml"
      - "scripts/emit_orchestrator_completion.py"
      - "recovery/orchestrator-completion-current.json"
      - "profiles/QORE-DEEPSEEK-V2.1.1-STABLE.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: qore-orchestrator-callback-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || 1 }}
  cancel-in-progress: false

jobs:
  callback-preflight:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout callback candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile and run callback regression self-test
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/emit_orchestrator_completion.py
          python3 scripts/emit_orchestrator_completion.py --self-test

      - name: Verify stable reviewer profile excludes operational callback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path("profiles/QORE-DEEPSEEK-V2.1.1-STABLE.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {
              ".github/workflows/deepseek-auto-dispatch.yml",
              ".github/workflows/deepseek-connection-test.yml",
              ".github/workflows/deepseek-qore-review.yml",
          }
          workflows = manifest.get("workflows")
          if not isinstance(workflows, dict) or set(workflows) != expected:
              raise SystemExit("STABLE profile must contain exactly the three qore-core-authorized review workflows")
          if manifest.get("permanent_workflow_count") != 3:
              raise SystemExit("STABLE permanent_workflow_count must be exactly 3")
          for path, declared in workflows.items():
              observed = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if observed != declared:
                  raise SystemExit(f"STABLE technical workflow blob mismatch for {path}: {declared} != {observed}")
          operational = manifest.get("operational_workflows")
          callback_path = ".github/workflows/qore-orchestrator-completion-callback.yml"
          if not isinstance(operational, dict) or not isinstance(operational.get(callback_path), dict):
              raise SystemExit("operational callback discovery metadata is missing")
          callback = operational[callback_path]
          if callback.get("profile_defining") is not False:
              raise SystemExit("orchestrator callback must remain non-profile-defining")
          observed_callback = subprocess.check_output(["git", "hash-object", callback_path], text=True).strip()
          if callback.get("blob") != observed_callback:
              raise SystemExit("operational callback discovery blob is stale")
          print("DeepSeek STABLE/operational workflow separation: PASS")
          PY

      - name: Verify DeepSeek workflow package run binding exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          needle = "run-name: DeepSeek QORE review · $" + "{{ inputs.package_id }}"
          lines = Path(".github/workflows/deepseek-qore-review.yml").read_text(encoding="utf-8").splitlines()
          if needle not in lines:
              raise SystemExit("DeepSeek run-name is not exactly package-bound")
          print("DeepSeek run-name package binding: PASS")
          PY

      - name: Validate bounded replay request when present
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("recovery/orchestrator-completion-current.json")
          if not path.exists():
              print("No replay request in candidate.")
              raise SystemExit(0)
          value = json.loads(path.read_text(encoding="utf-8"))
          allowed = {
              "schema_version",
              "source_run_id",
              "source_run_attempt",
              "source_head_sha",
              "package_id",
          }
          if not isinstance(value, dict) or set(value) != allowed:
              raise SystemExit("replay request keys are not exact")
          if value["schema_version"] != "qore.reviewer.completion.replay.v1":
              raise SystemExit("replay schema is invalid")
          if type(value["source_run_id"]) is not int or value["source_run_id"] <= 0:
              raise SystemExit("replay run id is invalid")
          if type(value["source_run_attempt"]) is not int or value["source_run_attempt"] <= 0:
              raise SystemExit("replay run attempt is invalid")
          if re.fullmatch(r"[0-9a-f]{40}", value["source_head_sha"]) is None:
              raise SystemExit("replay source HEAD is invalid")
          if re.fullmatch(r"QORE-SOL-[0-9a-f]{12}-DS-(?:EXPERT|CODER)-R[1-9][0-9]*", value["package_id"]) is None:
              raise SystemExit("replay package is invalid")
          print("Bounded replay request: PASS")
          PY

      - name: Create isolated orchestrator callback token
        id: callback-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_CALLBACK_APP_ID }}
          private-key: ${{ secrets.QORE_CALLBACK_APP_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-ai-orchestrator
          permission-contents: write

      - name: Prove cross-repository dispatch authority without waking Sol
        env:
          GH_TOKEN: ${{ steps.callback-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/mezas3238-hue/qore-ai-orchestrator --jq '.full_name'
          cat > "$RUNNER_TEMP/callback-preflight.json" <<'JSON'
          {
            "event_type": "qore_callback_preflight_v1",
            "client_payload": {
              "source": "qore-deepseek-reviewer",
              "purpose": "permission-preflight-no-listener"
            }
          }
          JSON
          gh api --method POST \
            repos/mezas3238-hue/qore-ai-orchestrator/dispatches \
            --input "$RUNNER_TEMP/callback-preflight.json"
          echo "Dedicated callback App can emit an unhandled repository_dispatch event."

  emit-completion:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce trusted default-branch callback
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout trusted reviewer callback code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create isolated orchestrator callback token
        id: callback-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_CALLBACK_APP_ID }}
          private-key: ${{ secrets.QORE_CALLBACK_APP_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-ai-orchestrator
          permission-contents: write

      - name: Validate exact completed run and wake Sol once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QORE_CALLBACK_TOKEN: ${{ steps.callback-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/emit_orchestrator_completion.py \
            --event "$GITHUB_EVENT_PATH" \
            --repository mezas3238-hue/qore-deepseek-reviewer \
            --workflow-name "DeepSeek QORE review" \
            --workflow-path ".github/workflows/deepseek-qore-review.yml" \
            --actor DEEPSEEK \
            --binding run_name

  replay-completion:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce trusted default-branch replay
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout trusted reviewer callback code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Parse exact bounded replay request
        id: replay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          value = json.loads(Path("recovery/orchestrator-completion-current.json").read_text(encoding="utf-8"))
          allowed = {
              "schema_version",
              "source_run_id",
              "source_run_attempt",
              "source_head_sha",
              "package_id",
          }
          if not isinstance(value, dict) or set(value) != allowed:
              raise SystemExit("replay request keys are not exact")
          if value["schema_version"] != "qore.reviewer.completion.replay.v1":
              raise SystemExit("replay schema is invalid")
          run_id = value["source_run_id"]
          attempt = value["source_run_attempt"]
          head = value["source_head_sha"]
          package = value["package_id"]
          if type(run_id) is not int or run_id <= 0:
              raise SystemExit("replay run id is invalid")
          if type(attempt) is not int or attempt <= 0:
              raise SystemExit("replay run attempt is invalid")
          if not isinstance(head, str) or re.fullmatch(r"[0-9a-f]{40}", head) is None:
              raise SystemExit("replay source HEAD is invalid")
          if not isinstance(package, str) or re.fullmatch(r"QORE-SOL-[0-9a-f]{12}-DS-(?:EXPERT|CODER)-R[1-9][0-9]*", package) is None:
              raise SystemExit("replay package is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
              output.write(f"attempt={attempt}\n")
              output.write(f"head={head}\n")
              output.write(f"package={package}\n")
          PY

      - name: Create isolated orchestrator callback token
        id: callback-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_CALLBACK_APP_ID }}
          private-key: ${{ secrets.QORE_CALLBACK_APP_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-ai-orchestrator
          permission-contents: write

      - name: Replay one exact terminal completion without rerunning reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QORE_CALLBACK_TOKEN: ${{ steps.callback-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/emit_orchestrator_completion.py \
            --source-run-id "${{ steps.replay.outputs.run_id }}" \
            --source-run-attempt "${{ steps.replay.outputs.attempt }}" \
            --expected-source-head-sha "${{ steps.replay.outputs.head }}" \
            --expected-package "${{ steps.replay.outputs.package }}" \
            --repository mezas3238-hue/qore-deepseek-reviewer \
            --workflow-name "DeepSeek QORE review" \
            --workflow-path ".github/workflows/deepseek-qore-review.yml" \
            --actor DEEPSEEK \
            --binding run_name
