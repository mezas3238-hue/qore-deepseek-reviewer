name: Probe R62G reviewer routing

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-r62g-reviewer-routing.yml
      - scripts/deepseek_reviewer_compact_budgeted_v16.py
      - scripts/deepseek_reviewer_compact_budgeted_v17.py
      - scripts/deepseek_reviewer_compact_budgeted_v20.py
      - scripts/probe_r62g_evidence_routing.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 476a93cdd08a064d0b99a139cd1b49287b937f21
          path: workspace/qore-core
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact R62G evidence routing and runtime contexts
        env:
          QORE_ROOT: ${{ github.workspace }}/workspace/qore-core
          PR_NUMBER: '461'
          EXPECTED_BASE: ebd0adf000874797653df92ea1c08a892cce6c8c
          EXPECTED_HEAD: 476a93cdd08a064d0b99a139cd1b49287b937f21
          EXPECTED_SYNTHETIC: 871def531b0f1222e6a1e61252af700f4ed204e3
          PACKAGE_ID: NO-MODEL-R62G-ROUTING-PROBE
          REVIEW_MODE: expert
          PROMPT_PATH: ${{ github.workspace }}/prompts/qore-umi14-umi12-final-owner-recert-001-expert-r90-compact.md
          REVIEW_OUTPUT: ${{ github.workspace }}/probe-review-not-used.md
          DEEPSEEK_API_KEY: not-used
          GH_TOKEN: not-used
        run: python scripts/probe_r62g_evidence_routing.py
