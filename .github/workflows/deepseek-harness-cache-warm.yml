name: DeepSeek Harness cache warmup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deepseek-harness-cache-warm.yml

permissions:
  contents: read

jobs:
  warm-dsh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore exact Harness cache
        id: dsh-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qore-dsh-install
          key: qore-dsh-${{ runner.os }}-${{ runner.arch }}-node24-0.1.1-rc.2

      - name: Install exact Harness on cache miss without provider credentials
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        env:
          DSH_VERSION: 0.1.1-rc.2
          DSH_INSTALL_ROOT: ${{ runner.temp }}/qore-dsh-install
          NODE_OPTIONS: --max-old-space-size=4096
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_PROGRESS: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        run: |
          set -euo pipefail
          RESOLVED="$(npm view "@deepseek-ai/dsh@${DSH_VERSION}" version)"
          test "$RESOLVED" = "$DSH_VERSION"
          rm -rf "$DSH_INSTALL_ROOT"
          mkdir -p "$DSH_INSTALL_ROOT"
          npm install --prefix "$DSH_INSTALL_ROOT" --no-save --no-audit --no-fund \
            "@deepseek-ai/dsh@${DSH_VERSION}"

      - name: Verify cached Harness package and CLI
        env:
          DSH_VERSION: 0.1.1-rc.2
          DSH_INSTALL_ROOT: ${{ runner.temp }}/qore-dsh-install
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          INSTALLED="$(node -p \
            "require('${DSH_INSTALL_ROOT}/node_modules/@deepseek-ai/dsh/package.json').version")"
          test "$INSTALLED" = "$DSH_VERSION"
          DSH_BIN="$DSH_INSTALL_ROOT/node_modules/.bin/dsh"
          test -x "$DSH_BIN"
          "$DSH_BIN" --help > "$RUNNER_TEMP/dsh-help.txt"
          test -s "$RUNNER_TEMP/dsh-help.txt"
          grep -q -- '--profile' "$RUNNER_TEMP/dsh-help.txt"
          echo "Harness cache ready: ${INSTALLED}; cache_hit=${{ steps.dsh-cache.outputs.cache-hit }}"
          echo "No DeepSeek provider credential was exposed by this workflow."
