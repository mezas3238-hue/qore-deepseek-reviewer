name: CIBO Cognitive final Correction003 materialize once

on:
  push:
    paths:
      - .github/workflows/cibo-cognitive-final-correction003-materialize-once.yml

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Create qore-core installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core

      - name: Checkout exact PR486 branch
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: agent/qore-cibo-cognitive-superarchitecture-001-independent-materialize
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact Correction003 candidate tree and push atomically
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 7bbec2a8add53745b27acd72bd9bf47fc71d3400
          EXPECTED_START: 262285ca8a0a3cd4c4c196f73249971514278774
          EXPECTED_START_TREE: 24a7423bb25bbd4096fd8af5004ddd0877fe4829
          ARTIFACT_ID: '9909522733'
          EXPECTED_PATCH_SHA256: 676fa7c76576bb3832270eb370677f6587a4507dfbb8bf8ae331d8f5c5783e5b
          TARGET_BRANCH: agent/qore-cibo-cognitive-superarchitecture-001-independent-materialize
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_START^{tree}")" = "$EXPECTED_START_TREE"
          test -z "$(git status --porcelain)"

          gh api "repos/mezas3238-hue/qore-deepseek-reviewer/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/c003.zip
          rm -rf /tmp/c003 /tmp/candidate
          mkdir -p /tmp/c003
          unzip -q /tmp/c003.zip -d /tmp/c003
          PATCH="$(find /tmp/c003 -type f -name 'harness-engineer-candidate.patch' -print -quit)"
          test -n "$PATCH"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

          cat > /tmp/expected-files.txt <<'EOF'
          docs/architecture/QORE-CIBO-COGNITIVE-EXECUTIVE-001.md
          docs/architecture/QORE-CIBO-COGNITIVE-SUPERARCHITECTURE-001.md
          src/qore/infrastructure/cibo_cognitive_attention.py
          src/qore/infrastructure/cibo_cognitive_common.py
          src/qore/infrastructure/cibo_cognitive_evaluation.py
          src/qore/infrastructure/cibo_cognitive_integration.py
          src/qore/infrastructure/cibo_cognitive_world_model.py
          src/qore/infrastructure/cibo_executive_brain.py
          src/qore/infrastructure/cibo_executive_deliberation.py
          src/qore/infrastructure/cibo_executive_journal.py
          src/qore/infrastructure/cibo_executive_memory.py
          src/qore/modules/cibo/cognitive_contracts.py
          tests/infrastructure/test_cibo_cognitive_boundaries.py
          tests/infrastructure/test_cibo_cognitive_common.py
          tests/infrastructure/test_cibo_cognitive_evaluation.py
          tests/infrastructure/test_cibo_cognitive_integration.py
          tests/infrastructure/test_cibo_cognitive_world_model.py
          tests/infrastructure/test_cibo_executive_brain.py
          tests/infrastructure/test_cibo_executive_deliberation.py
          tests/infrastructure/test_cibo_executive_journal.py
          tests/infrastructure/test_cibo_executive_memory.py
          tests/modules/cibo/test_cibo_cognitive_contracts.py
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt

          git worktree add --detach /tmp/candidate "$EXPECTED_START"
          git -C /tmp/candidate apply --check "$PATCH"
          git -C /tmp/candidate apply "$PATCH"
          git -C /tmp/candidate diff --check
          git -C /tmp/candidate diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 22
          test "$(git -C /tmp/candidate diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')" -le 10000

          git -C /tmp/candidate add -- $(cat /tmp/expected-files.txt)
          git -C /tmp/candidate diff --cached --check
          git -C /tmp/candidate diff --cached --name-only | sort > /tmp/staged-files.txt
          diff -u /tmp/expected-files.txt /tmp/staged-files.txt
          CANDIDATE_TREE="$(git -C /tmp/candidate write-tree)"

          git config user.name qore-cognitive-materializer
          git config user.email qore-cognitive-materializer@users.noreply.github.com
          NEW_HEAD="$(printf '%s\n' 'Materialize CIBO Cognitive final Correction 003 candidate' | git commit-tree "$CANDIDATE_TREE" -p "$EXPECTED_HEAD")"
          test "$(git rev-parse "$NEW_HEAD^")" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$NEW_HEAD^{tree}")" = "$CANDIDATE_TREE"

          git push origin "$NEW_HEAD:refs/heads/${TARGET_BRANCH}"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$NEW_HEAD"
          echo "NEW_HEAD=$NEW_HEAD"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE"
          echo "PATCH_SHA256=$EXPECTED_PATCH_SHA256"
