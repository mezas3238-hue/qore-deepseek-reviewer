name: Probe R88 builtins module vs mapping

on:
  push:
    paths:
      - '.github/workflows/probe-r88-builtins-module-vs-mapping.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create QORE Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core
      - name: Checkout exact corrected QORE head
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 1f3b3ebd4503932a72a54760201f3d8f12c837f5
          token: ${{ steps.app-token.outputs.token }}
          path: qore
          fetch-depth: 1
      - name: Install QORE test tooling
        working-directory: qore
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Adversarial module versus mapping matrix
        env:
          PYTHONPATH: ${{ github.workspace }}/qore/tests/infrastructure:${{ github.workspace }}/qore/src
        run: |
          python --version
          python - <<'PY'
          import test_universal_cross_asset_conformance_final_owner_r62g_guards as r62g
          import test_universal_cross_asset_conformance_final_owner_r62n_guards as r62n

          def runtime(source: str):
              namespace = {}
              try:
                  exec(source, namespace)
              except Exception as exc:
                  return type(exc).__name__, str(exc)
              return "OK", namespace.get("result")

          safe = {
              "direct": 'import builtins\nresult = builtins["eval"]("1+1")\n',
              "alias": 'import builtins as b\nresult = b["eval"]("1+1")\n',
              "get": 'import builtins\nresult = builtins.get("eval")("1+1")\n',
              "dunder_getitem": 'import builtins\nresult = builtins.__getitem__("eval")("1+1")\n',
              "operator_getitem": 'import builtins\nimport operator\nresult = operator.getitem(builtins, "eval")("1+1")\n',
              "itemgetter": 'import builtins\nimport operator\nresult = operator.itemgetter("eval")(builtins)("1+1")\n',
              "assignment_alias": 'import builtins\nb = builtins\nresult = b["eval"]("1+1")\n',
          }
          dangerous = {
              "dict": 'import builtins\nresult = builtins.__dict__["eval"]("1+1")\n',
              "vars": 'import builtins\nresult = vars(builtins)["eval"]("1+1")\n',
              "dunder": 'result = __builtins__["eval"]("1+1")\n',
              "operator_dict": 'import builtins\nimport operator\nresult = operator.getitem(builtins.__dict__, "eval")("1+1")\n',
              "itemgetter_dict": 'import builtins\nimport operator\nresult = operator.itemgetter("eval")(builtins.__dict__)("1+1")\n',
              "operator_dunder": 'import operator\nresult = operator.getitem(__builtins__, "eval")("1+1")\n',
              "direct_attribute": 'import builtins\nresult = builtins.eval("1+1")\n',
              "getattr_attribute": 'import builtins\nresult = getattr(builtins, "eval")("1+1")\n',
              "mapping_alias": 'import builtins\nm = builtins.__dict__\nresult = m["eval"]("1+1")\n',
          }

          for name, source in safe.items():
              actual = runtime(source)
              g = r62g._r62g_dynamic_execution_markers_from_source(source)
              n = r62n._r62n_dynamic_execution_markers_from_source(source)
              print("SAFE", name, actual, g, n)
              assert actual[0] in {"TypeError", "AttributeError", "NameError"}
              assert not any(item.startswith("call:") for item in g)
              assert not any(item.startswith("call:") for item in n)

          for name, source in dangerous.items():
              actual = runtime(source)
              g = r62g._r62g_dynamic_execution_markers_from_source(source)
              n = r62n._r62n_dynamic_execution_markers_from_source(source)
              print("DANGER", name, actual, g, n)
              assert actual == ("OK", 2)
              assert any(item.startswith("call:") for item in g)
              assert any(item.startswith("call:") for item in n)

          unbound = 'result = builtins["eval"]("1+1")\n'
          assert runtime(unbound)[0] == "NameError"
          assert r62g._r62g_dynamic_execution_markers_from_source(unbound) == ()
          assert not any(
              item.startswith("call:")
              for item in r62n._r62n_dynamic_execution_markers_from_source(unbound)
          )
          print("R88_CORRECTION_MATRIX_OK")
          PY
      - name: Validate permanent R62G and R62N suites
        working-directory: qore
        run: |
          ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py
          pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
