name: Verify single DeepSeek R4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-single-deepseek-r4.yml

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record active DeepSeek review runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deepseek-qore-review.yml \
            --status in_progress \
            --limit 10 \
            --json databaseId,createdAt,status,conclusion)"
          COUNT="$(printf '%s' "$RUNS" | jq 'length')"
          printf '%s\n' "$RUNS" | jq --argjson count "$COUNT" '{checked_at: now | todateiso8601, in_progress_count: $count, runs: sort_by(.createdAt)}' > /tmp/deepseek-r4-active.json
          CONTENT="$(base64 -w0 /tmp/deepseek-r4-active.json)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/ops/deepseek-r4-active.json" \
            -f message='ops: record DeepSeek R4 active runs' \
            -f content="$CONTENT" \
            -f branch=main >/dev/null
