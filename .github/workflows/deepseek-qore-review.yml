name: DeepSeek QORE review
run-name: DeepSeek QORE review · ${{ inputs.package_id }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: qore-core pull request number
        required: true
        default: "437"
      package_id:
        description: Immutable review package identifier
        required: true
        default: UNR013-ETAPAC-R8-DS-EXPERT-01
      expected_base:
        description: Expected frozen BASE SHA
        required: true
        default: db83b106f3a5e7f30a788567dfa970a38b7a379a
      expected_head:
        description: Expected frozen HEAD SHA
        required: true
        default: 1c99f1987e78b3be3d8bb6a0d1ecf98c5f3675dc
      expected_synthetic:
        description: Expected frozen synthetic PR merge SHA
        required: true
        default: cd97ad3dbd6edb68855d06aba475d636be983bd9
      expected_qg_summary:
        description: Exact QORE quality-gate summary JSON; use {} only for benchmarks
        required: true
        default: "{}"
      review_mode:
        description: Reviewer role
        required: true
        type: choice
        options:
          - expert
          - coder
        default: expert
      prompt_path:
        description: Target-specific prompt file in reviewer repository
        required: true
        default: prompts/unr013-r8-expert.md
      benchmark_only:
        description: Execute exact reviewer for benchmarking without publishing to qore-core
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Validate package routing and publication contract
        id: package-contract
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
          EXPECTED_QG_SUMMARY_JSON: ${{ inputs.expected_qg_summary }}
        run: |
          set -euo pipefail
          CONTRACT="$(python3 scripts/qg_package_contract.py workflow "$PACKAGE_ID" "$BENCHMARK_ONLY" "$EXPECTED_QG_SUMMARY_JSON")"
          echo "qg_summary=$(jq -c '.qg_summary' <<<"$CONTRACT")" >>"$GITHUB_OUTPUT"
          echo "benchmark_only=$(jq -r '.benchmark_only' <<<"$CONTRACT")" >>"$GITHUB_OUTPUT"
          echo "publish_allowed=$(jq -r '.publish_allowed' <<<"$CONTRACT")" >>"$GITHUB_OUTPUT"

      - name: Validate DSH reviewer controls before API spend
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/harness_reasoning_audit.py scripts/harness_usage_meter.py scripts/deepseek_balance_meter.py
          node --check harness/engineer/plugins/qore-adaptive-reasoning-controller.mjs
          test -s harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md
          test -s harness/reviewer/prompts/qore-deepseek-coder-swarm-v1.md
          test -s "${{ inputs.prompt_path }}"
          grep -q 'QORE_CHECKPOINT_BEGIN' harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md
          grep -q 'QORE_CHECKPOINT_BEGIN' harness/reviewer/prompts/qore-deepseek-coder-swarm-v1.md
          grep -q 'checkpoint_path' harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md
          grep -q 'checkpoint_path' harness/reviewer/prompts/qore-deepseek-coder-swarm-v1.md

      - name: Create QORE Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core

      - name: Verify live PR binding before checkout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$PR_JSON")" = "open"
          test "$(jq -r '.merged' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.base.sha' <<<"$PR_JSON")" = "$EXPECTED_BASE"
          test "$(jq -r '.head.sha' <<<"$PR_JSON")" = "$EXPECTED_HEAD"
          test "$(jq -r '.merge_commit_sha' <<<"$PR_JSON")" = "$EXPECTED_SYNTHETIC"

      - name: Checkout exact qore-core HEAD
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: ${{ inputs.expected_head }}
          token: ${{ steps.app-token.outputs.token }}
          path: workspace/qore-core
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact git binding and synthetic parents
        working-directory: workspace/qore-core
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "${EXPECTED_BASE}^{commit}"
          git fetch origin "refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/qore-review-merge"
          test "$(git rev-parse refs/remotes/origin/qore-review-merge)" = "$EXPECTED_SYNTHETIC"
          test "$(git show -s --format=%P "$EXPECTED_SYNTHETIC")" = "$EXPECTED_BASE $EXPECTED_HEAD"
          HEAD_TREE="$(git show -s --format=%T "$EXPECTED_HEAD")"
          SYNTHETIC_TREE="$(git show -s --format=%T "$EXPECTED_SYNTHETIC")"
          test "$HEAD_TREE" = "$SYNTHETIC_TREE"
          echo "$HEAD_TREE" > "$GITHUB_WORKSPACE/deepseek-review-tree.txt"
          git diff --name-status "$EXPECTED_BASE" "$EXPECTED_HEAD" > "$GITHUB_WORKSPACE/deepseek-review-changed-files.txt"
          git diff --stat "$EXPECTED_BASE" "$EXPECTED_HEAD" > "$GITHUB_WORKSPACE/deepseek-review-diff-stat.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install qore-core development dependencies for semantic LSP
        working-directory: workspace/qore-core
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore exact DSH plus LSP cache
        id: dsh-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qore-dsh-engineer-lsp-install
          key: qore-dsh-engineer-lsp-${{ runner.os }}-${{ runner.arch }}-node24-dsh0.1.1-rc.2-pyright1.1.413

      - name: Require warm exact DSH plus LSP cache before API spend
        run: |
          set -euo pipefail
          test "${{ steps.dsh-cache.outputs.cache-hit }}" = "true" || exit 78
          ROOT="${{ runner.temp }}/qore-dsh-engineer-lsp-install"
          test "$(node -p "require('${ROOT}/node_modules/@deepseek-ai/dsh/package.json').version")" = "0.1.1-rc.2"
          test "$(node -p "require('${ROOT}/node_modules/pyright/package.json').version")" = "1.1.413"
          test -x "$ROOT/node_modules/.bin/dsh"
          test -x "$ROOT/node_modules/.bin/pyright-langserver"

      - name: Prepare DSH reviewer runtime, QORE Skills, LSP, subagents and adaptive reasoning
        env:
          DSH_HOME: ${{ runner.temp }}/qore-dsh-reviewer-home
          DSH_INSTALL_ROOT: ${{ runner.temp }}/qore-dsh-engineer-lsp-install
        run: |
          set -euo pipefail
          rm -rf "$DSH_HOME"
          mkdir -p "$DSH_HOME/skills" "$DSH_HOME/profiles/headless"
          chmod 700 "$DSH_HOME"
          cp -R harness/skills/. "$DSH_HOME/skills/"
          ln -s "$DSH_INSTALL_ROOT/node_modules" "$DSH_HOME/profiles/headless/node_modules"
          PYRIGHT_LANGSERVER="$DSH_INSTALL_ROOT/node_modules/.bin/pyright-langserver"
          REASONING_PLUGIN="$DSH_HOME/profiles/headless/qore-adaptive-reasoning-controller.mjs"
          cp harness/engineer/plugins/qore-adaptive-reasoning-controller.mjs "$REASONING_PLUGIN"

          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          agent-default-model:
            provider: deepseek-official
            model: deepseek-v4-pro
            reasoningEffort: high
          YAML

          cat > "$DSH_HOME/cordis.patch.yml" <<EOF
          - id: session-persistence-jsonl
            config:
              root: !!js dshHomePath('sessions')
              compression: none
              packChunks: false
          - insert:
              - id: qore-adaptive-reasoning-controller
                name: '${REASONING_PLUGIN}'
              - id: qore-lsp
                name: '@deepseek-ai/dsh-lsp'
              - id: qore-lsp-stdio
                name: '@deepseek-ai/dsh-lsp-stdio'
                config:
                  servers:
                    python:
                      command: '${PYRIGHT_LANGSERVER}'
                      args: ['--stdio']
                      extensionToLanguage:
                        '.py': python
              - id: qore-tool-lsp
                name: '@deepseek-ai/dsh-tool-lsp'
          EOF
          chmod 600 "$DSH_HOME/settings.yaml" "$DSH_HOME/cordis.patch.yml"

          cat > "$DSH_HOME/profiles/headless/qore-resolution-smoke.mjs" <<'EOF'
          const names=['@deepseek-ai/dsh-lsp','@deepseek-ai/dsh-lsp-stdio','@deepseek-ai/dsh-tool-lsp'];
          console.log(JSON.stringify(Object.fromEntries(names.map(n=>[n,import.meta.resolve(n)]))));
          EOF
          node "$DSH_HOME/profiles/headless/qore-resolution-smoke.mjs" > deepseek-review-lsp-resolution.json
          cp scripts/harness_lsp_smoke.mjs "$DSH_INSTALL_ROOT/harness_lsp_smoke.mjs"
          node "$DSH_INSTALL_ROOT/harness_lsp_smoke.mjs" "$PYRIGHT_LANGSERVER" > deepseek-review-lsp-smoke.json
          jq -e '.definition_locations >= 1 and .reference_locations >= 2 and .hover_available == true' deepseek-review-lsp-smoke.json >/dev/null

      - name: Seal qore-core publication authority before model execution
        working-directory: workspace/qore-core
        run: |
          set -euo pipefail
          git remote remove origin || true
          test -z "$(git remote)"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Capture DeepSeek balance baseline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/deepseek_balance_meter.py snapshot "$RUNNER_TEMP/deepseek-reviewer-before.json"

      - name: Run independent DSH Expert or Coder swarm reviewer
        id: reviewer
        working-directory: workspace/qore-core
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_HOME: ${{ runner.temp }}/qore-dsh-reviewer-home
          DSH_INSTALL_ROOT: ${{ runner.temp }}/qore-dsh-engineer-lsp-install
          DSH_BIN: ${{ runner.temp }}/qore-dsh-engineer-lsp-install/node_modules/.bin/dsh
          REVIEW_MODE: ${{ inputs.review_mode }}
          TARGET_PROMPT_PATH: ${{ github.workspace }}/${{ inputs.prompt_path }}
          PACKAGE_ID: ${{ inputs.package_id }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
          EXPECTED_QG_SUMMARY_JSON: ${{ steps.package-contract.outputs.qg_summary }}
        run: |
          set -euo pipefail
          if test "$REVIEW_MODE" = "expert"; then
            SWARM_PROMPT="$GITHUB_WORKSPACE/harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md"
          else
            SWARM_PROMPT="$GITHUB_WORKSPACE/harness/reviewer/prompts/qore-deepseek-coder-swarm-v1.md"
          fi
          BASE_PROMPT="$(cat "$SWARM_PROMPT")"
          TARGET_PROMPT="$(cat "$TARGET_PROMPT_PATH")"
          TREE="$(cat "$GITHUB_WORKSPACE/deepseek-review-tree.txt")"
          CHECKPOINT_PATH="$RUNNER_TEMP/deepseek-review-checkpoints.md"

          cat > "$CHECKPOINT_PATH" <<EOF
          QORE_CHECKPOINT_BEGIN
          package_id: ${PACKAGE_ID}
          review_mode: ${REVIEW_MODE}
          checkpoint_sequence: 0
          phase: HOST_INITIALIZED
          binding: BASE=${EXPECTED_BASE} HEAD=${EXPECTED_HEAD} SYNTHETIC=${EXPECTED_SYNTHETIC} TREE=${TREE}
          completed: workflow binding and pre-spend controls reached
          PENDING NEXT ACTION: primary reviewer verifies binding and begins/resumes the assigned semantic work
          SAFE RESUME INSTRUCTION: preserve this exact binding; no model work has yet been certified by this run
          QORE_CHECKPOINT_END
          EOF

          TASK="$(cat <<EOF
          ${BASE_PROMPT}

          # TARGET-SPECIFIC REVIEW PACKAGE
          ${TARGET_PROMPT}

          # IMMUTABLE BINDING
          package_id=${PACKAGE_ID}
          review_mode=${REVIEW_MODE}
          expected_base=${EXPECTED_BASE}
          expected_head=${EXPECTED_HEAD}
          expected_synthetic=${EXPECTED_SYNTHETIC}
          expected_tree=${TREE}
          expected_qg_summary=${EXPECTED_QG_SUMMARY_JSON}

          # DURABLE CHECKPOINT TARGET
          checkpoint_path=${CHECKPOINT_PATH}
          Append every mandatory checkpoint to that exact host-supplied platform-temp path. The host already wrote checkpoint sequence 0. Begin your own checkpoints at sequence 1. Never overwrite or truncate the file.

          Work only against this exact frozen checkout. Use native subagents according to your role mandate. Semantic LSP in the primary session is mandatory. The host adaptively controls reasoning effort: HIGH baseline, MAX for material complexity/risk. You have up to 60 minutes but should finish as soon as the review is genuinely complete. No repository edits, commit, remote, push, merge, publication, network research, Production authority or real-capital action.
          EOF
          )"

          mkdir -p "$RUNNER_TEMP/qore-reviewer-process-home"
          START_EPOCH="$(date +%s)"
          set +e
          env -i \
            PATH="$DSH_INSTALL_ROOT/node_modules/.bin:$PATH" \
            HOME="$RUNNER_TEMP/qore-reviewer-process-home" \
            TMPDIR="$RUNNER_TEMP" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 CI=true \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            DSH_HOME="$DSH_HOME" \
            DSH_PERMISSION_MODE=workspace-write \
            QORE_REASONING_AUDIT_PATH=/tmp/qore-reviewer-reasoning-controller.jsonl \
            NODE_OPTIONS=--max-old-space-size=4096 \
            PYTHONDONTWRITEBYTECODE=1 \
            timeout --signal=TERM --kill-after=30s 60m \
              "$DSH_BIN" --profile headless "$TASK" \
              | tee "$GITHUB_WORKSPACE/deepseek-review.md"
          STATUS="${PIPESTATUS[0]}"
          set -e
          END_EPOCH="$(date +%s)"
          printf '%s\n' "$((END_EPOCH - START_EPOCH))" > "$RUNNER_TEMP/deepseek-reviewer-ai-seconds.txt"
          test "$STATUS" -eq 0
          test -s "$GITHUB_WORKSPACE/deepseek-review.md"
          test -s "$CHECKPOINT_PATH"
          test "$(grep -c '^QORE_CHECKPOINT_BEGIN$' "$CHECKPOINT_PATH")" -ge 2
          test "$(grep -c '^QORE_CHECKPOINT_END$' "$CHECKPOINT_PATH")" -ge 2
          grep -q 'PENDING NEXT ACTION' "$CHECKPOINT_PATH"
          grep -q 'SAFE RESUME INSTRUCTION' "$CHECKPOINT_PATH"
          grep -q '^## SUBAGENT SWARM' "$GITHUB_WORKSPACE/deepseek-review.md"
          grep -q '^## LSP EVIDENCE' "$GITHUB_WORKSPACE/deepseek-review.md"
          grep -q '^## DURABLE JOURNAL SUMMARY' "$GITHUB_WORKSPACE/deepseek-review.md"
          grep -q '^## RESUME STATE' "$GITHUB_WORKSPACE/deepseek-review.md"
          grep -Eq 'VALIDACIÓN OK|EVIDENCIA INSUFICIENTE|VALIDATION BLOCKED|## MATERIAL FINDINGS' "$GITHUB_WORKSPACE/deepseek-review.md"

      - name: Collect durable reviewer checkpoint evidence
        if: ${{ always() }}
        run: |
          set +e
          if test -s "$RUNNER_TEMP/deepseek-review-checkpoints.md"; then
            cp "$RUNNER_TEMP/deepseek-review-checkpoints.md" "$GITHUB_WORKSPACE/deepseek-review-checkpoints.md"
          fi

      - name: Measure DSH reviewer usage
        if: ${{ always() }}
        env:
          DSH_HOME: ${{ runner.temp }}/qore-dsh-reviewer-home
        run: |
          set -euo pipefail
          if find "$DSH_HOME/sessions" -type f -name session.jsonl -print -quit 2>/dev/null | grep -q .; then
            python3 scripts/harness_usage_meter.py --sessions "$DSH_HOME/sessions" --output deepseek-reviewer-usage.json
          else
            printf '%s\n' '{"measurement_available":false,"reason":"no session.jsonl produced"}' > deepseek-reviewer-usage.json
          fi

      - name: Enforce adaptive HIGH to MAX reasoning evidence
        if: ${{ steps.reviewer.outcome == 'success' }}
        env:
          DSH_HOME: ${{ runner.temp }}/qore-dsh-reviewer-home
        run: |
          set -euo pipefail
          python3 scripts/harness_reasoning_audit.py \
            --sessions "$DSH_HOME/sessions" \
            --controller-audit /tmp/qore-reviewer-reasoning-controller.jsonl \
            --output deepseek-reasoning-audit.json

      - name: Enforce immutable read-only candidate after reviewer
        if: ${{ steps.reviewer.outcome == 'success' }}
        working-directory: workspace/qore-core
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git remote)"
          git diff --quiet HEAD --
          git diff --cached --quiet HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Capture DeepSeek balance delta
        if: ${{ always() }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if test -s "$RUNNER_TEMP/deepseek-reviewer-before.json"; then
            python3 scripts/deepseek_balance_meter.py delta "$RUNNER_TEMP/deepseek-reviewer-before.json" deepseek-reviewer-billing-delta.json
          else
            printf '%s\n' '{"measurement_available":false,"reason":"baseline not captured"}' > deepseek-reviewer-billing-delta.json
          fi

      - name: Revalidate complete frozen PR immediately before publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$PR_JSON")" = "open"
          test "$(jq -r '.merged' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.base.sha' <<<"$PR_JSON")" = "$EXPECTED_BASE"
          test "$(jq -r '.head.sha' <<<"$PR_JSON")" = "$EXPECTED_HEAD"
          test "$(jq -r '.merge_commit_sha' <<<"$PR_JSON")" = "$EXPECTED_SYNTHETIC"
          SYNTHETIC_JSON="$(gh api "repos/mezas3238-hue/qore-core/git/commits/${EXPECTED_SYNTHETIC}")"
          HEAD_JSON="$(gh api "repos/mezas3238-hue/qore-core/git/commits/${EXPECTED_HEAD}")"
          test "$(jq -r '[.parents[].sha] | join(" ")' <<<"$SYNTHETIC_JSON")" = "$EXPECTED_BASE $EXPECTED_HEAD"
          test "$(jq -r '.tree.sha' <<<"$SYNTHETIC_JSON")" = "$(jq -r '.tree.sha' <<<"$HEAD_JSON")"

      - name: Publish DeepSeek review on exact HEAD
        if: ${{ steps.package-contract.outputs.publish_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          review = Path('deepseek-review.md').read_text(encoding='utf-8')
          body = f"<!-- QORE-DEEPSEEK-REVIEW package={os.environ['PACKAGE_ID']} head={os.environ['EXPECTED_HEAD']} -->\n\n" + review
          Path('review-payload.json').write_text(json.dumps({'body': body, 'event': 'COMMENT', 'commit_id': os.environ['EXPECTED_HEAD']}), encoding='utf-8')
          PY
          gh api --method POST "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}/reviews" --input review-payload.json --jq '{id: .id, state: .state, user: .user.login, commit_id: .commit_id}'

      - name: Upload DSH reviewer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-dsh-${{ inputs.package_id }}
          path: |
            deepseek-review.md
            deepseek-review-checkpoints.md
            deepseek-review-tree.txt
            deepseek-review-changed-files.txt
            deepseek-review-diff-stat.txt
            deepseek-review-lsp-resolution.json
            deepseek-review-lsp-smoke.json
            deepseek-reviewer-usage.json
            deepseek-reasoning-audit.json
            deepseek-reviewer-billing-delta.json
          if-no-files-found: warn
          retention-days: 30

      - name: Review complete
        if: ${{ always() }}
        run: |
          echo "DSH DeepSeek workflow completed; mode=${{ inputs.review_mode }} benchmark_only=${{ steps.package-contract.outputs.benchmark_only }}."
