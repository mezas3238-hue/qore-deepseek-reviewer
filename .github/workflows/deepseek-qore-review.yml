name: DeepSeek QORE review
run-name: DeepSeek QORE review · ${{ inputs.package_id }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: qore-core pull request number
        required: true
        default: "437"
      package_id:
        description: Immutable review package identifier
        required: true
        default: UNR013-ETAPAC-R8-DS-EXPERT-01
      expected_base:
        description: Expected frozen BASE SHA
        required: true
        default: db83b106f3a5e7f30a788567dfa970a38b7a379a
      expected_head:
        description: Expected frozen HEAD SHA
        required: true
        default: 1c99f1987e78b3be3d8bb6a0d1ecf98c5f3675dc
      expected_synthetic:
        description: Expected frozen synthetic PR merge SHA
        required: true
        default: cd97ad3dbd6edb68855d06aba475d636be983bd9
      expected_qg_summary:
        description: Exact QORE quality-gate summary JSON; use {} only for benchmarks
        required: true
        default: "{}"
      review_mode:
        description: Reviewer role
        required: true
        type: choice
        options:
          - expert
          - coder
        default: expert
      prompt_path:
        description: Prompt file in reviewer repository
        required: true
        default: prompts/unr013-r8-expert.md
      benchmark_only:
        description: Execute exact reviewer for token benchmarking without publishing to qore-core
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Validate package routing and publication contract
        id: package-contract
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
          EXPECTED_QG_SUMMARY_JSON: ${{ inputs.expected_qg_summary }}
        run: |
          set -euo pipefail

          CONTRACT="$(
            python3 scripts/qg_package_contract.py workflow \
              "$PACKAGE_ID" "$BENCHMARK_ONLY" "$EXPECTED_QG_SUMMARY_JSON"
          )"
          echo "qg_summary=$(jq -c '.qg_summary' <<<"$CONTRACT")" >>"$GITHUB_OUTPUT"
          echo "benchmark_only=$(jq -r '.benchmark_only' <<<"$CONTRACT")" >>"$GITHUB_OUTPUT"
          echo "publish_allowed=$(jq -r '.publish_allowed' <<<"$CONTRACT")" >>"$GITHUB_OUTPUT"
          echo "Package routing and publication contract validated."

      - name: Validate adaptive Expert Coder reasoning before API spend
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/deepseek_adaptive_review_reasoning.py \
            scripts/deepseek_review_reasoning_audit.py \
            scripts/deepseek_reviewer_v2_1_2_adaptive_reasoning_entrypoint.py \
            scripts/run_review_with_meter.py
          python3 scripts/deepseek_adaptive_review_reasoning.py --self-test

      - name: Create QORE Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core

      - name: Verify live PR binding before checkout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          LIVE_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          LIVE_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          LIVE_BASE="$(printf '%s' "$PR_JSON" | jq -r '.base.sha')"
          LIVE_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          LIVE_SYNTHETIC="$(printf '%s' "$PR_JSON" | jq -r '.merge_commit_sha')"

          echo "PR state: ${LIVE_STATE}; merged=${LIVE_MERGED}"
          echo "BASE: ${LIVE_BASE}"
          echo "HEAD: ${LIVE_HEAD}"
          echo "SYNTHETIC: ${LIVE_SYNTHETIC}"

          test "$LIVE_STATE" = "open"
          test "$LIVE_MERGED" = "false"
          test "$LIVE_BASE" = "$EXPECTED_BASE"
          test "$LIVE_HEAD" = "$EXPECTED_HEAD"
          test "$LIVE_SYNTHETIC" = "$EXPECTED_SYNTHETIC"

      - name: Checkout exact qore-core HEAD
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: ${{ inputs.expected_head }}
          token: ${{ steps.app-token.outputs.token }}
          path: workspace/qore-core
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact git binding and synthetic parents
        working-directory: workspace/qore-core
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "${EXPECTED_BASE}^{commit}"

          git fetch origin \
            "refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/qore-review-merge"

          LIVE_SYNTHETIC="$(git rev-parse refs/remotes/origin/qore-review-merge)"
          test "$LIVE_SYNTHETIC" = "$EXPECTED_SYNTHETIC"

          PARENTS="$(git show -s --format=%P "$EXPECTED_SYNTHETIC")"
          test "$PARENTS" = "$EXPECTED_BASE $EXPECTED_HEAD"

          HEAD_TREE="$(git show -s --format=%T "$EXPECTED_HEAD")"
          SYNTHETIC_TREE="$(git show -s --format=%T "$EXPECTED_SYNTHETIC")"
          test "$HEAD_TREE" = "$SYNTHETIC_TREE"

          echo "Frozen binding verified."
          git diff --name-status "$EXPECTED_BASE" "$EXPECTED_HEAD"
          git diff --stat "$EXPECTED_BASE" "$EXPECTED_HEAD"

      - name: Run independent DeepSeek reviewer with spend meter
        id: reviewer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QORE_ROOT: ${{ github.workspace }}/workspace/qore-core
          PR_NUMBER: ${{ inputs.pr_number }}
          PACKAGE_ID: ${{ inputs.package_id }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
          EXPECTED_QG_SUMMARY_JSON: ${{ steps.package-contract.outputs.qg_summary }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          PROMPT_PATH: ${{ github.workspace }}/${{ inputs.prompt_path }}
          REVIEW_OUTPUT: ${{ github.workspace }}/deepseek-review.md
          DEEPSEEK_REASONING_AUDIT: ${{ github.workspace }}/deepseek-reasoning-effort.jsonl
          DEEPSEEK_MODEL: deepseek-v4-pro
          DEEPSEEK_MAX_MANDATORY_CHANGED_CHARS: "600000"
          DEEPSEEK_MAX_FINAL_EVIDENCE_CHARS: "650000"
        run: |
          set -euo pipefail
          python3 scripts/run_review_with_meter.py

      - name: Verify adaptive HIGH MAX reasoning evidence
        if: ${{ steps.reviewer.outcome == 'success' }}
        env:
          REVIEW_MODE: ${{ inputs.review_mode }}
        run: |
          set -euo pipefail
          python3 scripts/deepseek_review_reasoning_audit.py \
            --audit deepseek-reasoning-effort.jsonl \
            --mode "$REVIEW_MODE" \
            --output deepseek-reasoning-audit.json

      - name: Revalidate complete frozen PR immediately before publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$PR_JSON")" = "open"
          test "$(jq -r '.merged' <<<"$PR_JSON")" = "false"
          test "$(jq -r '.base.sha' <<<"$PR_JSON")" = "$EXPECTED_BASE"
          test "$(jq -r '.head.sha' <<<"$PR_JSON")" = "$EXPECTED_HEAD"
          test "$(jq -r '.merge_commit_sha' <<<"$PR_JSON")" = "$EXPECTED_SYNTHETIC"

          SYNTHETIC_JSON="$(
            gh api "repos/mezas3238-hue/qore-core/git/commits/${EXPECTED_SYNTHETIC}"
          )"
          HEAD_JSON="$(
            gh api "repos/mezas3238-hue/qore-core/git/commits/${EXPECTED_HEAD}"
          )"
          PARENTS="$(jq -r '[.parents[].sha] | join(" ")' <<<"$SYNTHETIC_JSON")"
          SYNTHETIC_TREE="$(jq -r '.tree.sha' <<<"$SYNTHETIC_JSON")"
          HEAD_TREE="$(jq -r '.tree.sha' <<<"$HEAD_JSON")"

          test "$PARENTS" = "$EXPECTED_BASE $EXPECTED_HEAD"
          test "$SYNTHETIC_TREE" = "$HEAD_TREE"
          echo "Complete pre-publication freeze revalidated."

      - name: Publish DeepSeek review on exact HEAD
        if: ${{ steps.package-contract.outputs.publish_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          review = Path("deepseek-review.md").read_text(encoding="utf-8")
          body = (
              f"<!-- QORE-DEEPSEEK-REVIEW package={os.environ['PACKAGE_ID']} "
              f"head={os.environ['EXPECTED_HEAD']} -->\n\n" + review
          )
          payload = {
              "body": body,
              "event": "COMMENT",
              "commit_id": os.environ["EXPECTED_HEAD"],
          }
          Path("review-payload.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY

          gh api \
            --method POST \
            "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}/reviews" \
            --input review-payload.json \
            --jq '{id: .id, state: .state, user: .user.login, commit_id: .commit_id}'

      - name: Upload benchmark evidence
        if: ${{ always() && steps.package-contract.outputs.benchmark_only == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-${{ inputs.package_id }}
          path: |
            deepseek-review.md
            deepseek-usage.jsonl
            deepseek-reasoning-effort.jsonl
            deepseek-reasoning-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record benchmark telemetry
        if: ${{ always() && steps.package-contract.outputs.benchmark_only == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ inputs.package_id }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          review_path = Path("deepseek-review.md")
          usage_path = Path("deepseek-usage.jsonl")
          review = review_path.read_text(encoding="utf-8") if review_path.is_file() else ""
          match = re.search(r"<!-- QORE-DEEPSEEK-USAGE (\{.*?\}) -->", review, re.S)
          telemetry = match.group(1) if match else "{}"

          if telemetry == "{}" and usage_path.is_file():
              totals = {
                  "api_calls": 0,
                  "prompt_tokens": 0,
                  "prompt_cache_hit_tokens": 0,
                  "prompt_cache_miss_tokens": 0,
                  "completion_tokens": 0,
                  "reasoning_tokens": 0,
              }
              for line in usage_path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  totals["api_calls"] += 1
                  for key in tuple(totals)[1:]:
                      totals[key] += int(row.get(key, 0) or 0)
              telemetry = json.dumps(totals, sort_keys=True, separators=(",", ":"))

          verdict_lines = []
          if review:
              for line in review.splitlines():
                  stripped = line.strip()
                  if (
                      stripped.startswith("HALLAZGOS")
                      or "VALIDACIÓN" in stripped
                      or stripped.startswith("EVIDENCIA INSUFICIENTE")
                  ):
                      verdict_lines.append(stripped)
              verdict_lines = verdict_lines[-8:]

          body = [
              f"## Benchmark `{os.environ['PACKAGE_ID']}`",
              "",
              f"- HEAD: `{os.environ['EXPECTED_HEAD']}`",
              f"- workflow job status: `{os.environ['JOB_STATUS']}`",
              f"- run: {os.environ['RUN_URL']}",
              "",
              "### Telemetry",
              "```json",
              telemetry,
              "```",
          ]
          if verdict_lines:
              body.extend(["", "### Verdict markers", *[f"- {line}" for line in verdict_lines]])
          body.extend(["", "Full review and JSONL telemetry are retained as the run artifact."])
          Path("benchmark-comment.md").write_text("\n".join(body) + "\n", encoding="utf-8")
          PY

          gh issue comment 5 \
            --repo mezas3238-hue/qore-deepseek-reviewer \
            --body-file benchmark-comment.md

      - name: Review complete
        if: ${{ always() }}
        run: |
          echo "DeepSeek workflow completed; benchmark_only=${{ steps.package-contract.outputs.benchmark_only }}."
