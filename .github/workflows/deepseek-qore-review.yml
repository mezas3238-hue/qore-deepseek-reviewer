name: DeepSeek QORE review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: qore-core pull request number
        required: true
        default: "437"
      package_id:
        description: Immutable review package identifier
        required: true
        default: UNR013-ETAPAC-R8-DS-EXPERT-01
      expected_base:
        description: Expected frozen BASE SHA
        required: true
        default: db83b106f3a5e7f30a788567dfa970a38b7a379a
      expected_head:
        description: Expected frozen HEAD SHA
        required: true
        default: 1c99f1987e78b3be3d8bb6a0d1ecf98c5f3675dc
      expected_synthetic:
        description: Expected frozen synthetic PR merge SHA
        required: true
        default: cd97ad3dbd6edb68855d06aba475d636be983bd9
      review_mode:
        description: Reviewer role
        required: true
        type: choice
        options:
          - expert
          - coder
        default: expert
      prompt_path:
        description: Prompt file in reviewer repository
        required: true
        default: prompts/unr013-r8-expert.md

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Create QORE Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.QORE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.QORE_REVIEWER_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core

      - name: Verify live PR binding before checkout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}")"
          LIVE_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          LIVE_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          LIVE_BASE="$(printf '%s' "$PR_JSON" | jq -r '.base.sha')"
          LIVE_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          LIVE_SYNTHETIC="$(printf '%s' "$PR_JSON" | jq -r '.merge_commit_sha')"

          echo "PR state: ${LIVE_STATE}; merged=${LIVE_MERGED}"
          echo "BASE: ${LIVE_BASE}"
          echo "HEAD: ${LIVE_HEAD}"
          echo "SYNTHETIC: ${LIVE_SYNTHETIC}"

          test "$LIVE_STATE" = "open"
          test "$LIVE_MERGED" = "false"
          test "$LIVE_BASE" = "$EXPECTED_BASE"
          test "$LIVE_HEAD" = "$EXPECTED_HEAD"
          test "$LIVE_SYNTHETIC" = "$EXPECTED_SYNTHETIC"

      - name: Checkout exact qore-core HEAD
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: ${{ inputs.expected_head }}
          token: ${{ steps.app-token.outputs.token }}
          path: workspace/qore-core
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact git binding and synthetic parents
        working-directory: workspace/qore-core
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "${EXPECTED_BASE}^{commit}"

          git fetch origin \
            "refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/qore-review-merge"

          LIVE_SYNTHETIC="$(git rev-parse refs/remotes/origin/qore-review-merge)"
          test "$LIVE_SYNTHETIC" = "$EXPECTED_SYNTHETIC"

          PARENTS="$(git show -s --format=%P "$EXPECTED_SYNTHETIC")"
          test "$PARENTS" = "$EXPECTED_BASE $EXPECTED_HEAD"

          HEAD_TREE="$(git show -s --format=%T "$EXPECTED_HEAD")"
          SYNTHETIC_TREE="$(git show -s --format=%T "$EXPECTED_SYNTHETIC")"
          test "$HEAD_TREE" = "$SYNTHETIC_TREE"

          echo "Frozen binding verified."
          git diff --name-status "$EXPECTED_BASE" "$EXPECTED_HEAD"
          git diff --stat "$EXPECTED_BASE" "$EXPECTED_HEAD"

      - name: Run independent DeepSeek reviewer with spend meter
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QORE_ROOT: ${{ github.workspace }}/workspace/qore-core
          PR_NUMBER: ${{ inputs.pr_number }}
          PACKAGE_ID: ${{ inputs.package_id }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_SYNTHETIC: ${{ inputs.expected_synthetic }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          PROMPT_PATH: ${{ github.workspace }}/${{ inputs.prompt_path }}
          REVIEW_OUTPUT: ${{ github.workspace }}/deepseek-review.md
          DEEPSEEK_MODEL: deepseek-v4-pro
        run: |
          set -euo pipefail
          python3 scripts/run_review_with_meter.py

      - name: Verify frozen HEAD again before publishing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          LIVE_HEAD="$(gh api "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "Pre-publish HEAD: ${LIVE_HEAD}"
          test "$LIVE_HEAD" = "$EXPECTED_HEAD"

      - name: Publish DeepSeek review on exact HEAD
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          review = Path("deepseek-review.md").read_text(encoding="utf-8")
          body = (
              f"<!-- QORE-DEEPSEEK-REVIEW package={os.environ['PACKAGE_ID']} "
              f"head={os.environ['EXPECTED_HEAD']} -->\n\n" + review
          )
          payload = {
              "body": body,
              "event": "COMMENT",
              "commit_id": os.environ["EXPECTED_HEAD"],
          }
          Path("review-payload.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY

          gh api \
            --method POST \
            "repos/mezas3238-hue/qore-core/pulls/${PR_NUMBER}/reviews" \
            --input review-payload.json \
            --jq '{id: .id, state: .state, user: .user.login, commit_id: .commit_id}'

      - name: Review complete
        run: |
          echo "DeepSeek review completed and published without modifying qore-core."
