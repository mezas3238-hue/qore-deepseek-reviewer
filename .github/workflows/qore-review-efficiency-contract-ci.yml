name: QORE Review Efficiency Contract CI

on:
  push:
    branches: [main]
    paths:
      - 'harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md'
      - 'harness/reviewer/prompts/qore-deepseek-coder-swarm-v1.md'
      - 'harness/docs/QORE-REVIEW-EFFICIENCY-NO-QUALITY-LOSS-V1.md'
      - 'scripts/test_reviewer_efficiency_contract.py'
      - '.github/workflows/qore-review-efficiency-contract-ci.yml'
  pull_request:
    paths:
      - 'harness/reviewer/prompts/qore-deepseek-expert-swarm-v1.md'
      - 'harness/reviewer/prompts/qore-deepseek-coder-swarm-v1.md'
      - 'harness/docs/QORE-REVIEW-EFFICIENCY-NO-QUALITY-LOSS-V1.md'
      - 'scripts/test_reviewer_efficiency_contract.py'
      - '.github/workflows/qore-review-efficiency-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile contract test
        run: python3 -m py_compile scripts/test_reviewer_efficiency_contract.py
      - name: Enforce no-quality-loss reviewer contract
        run: python3 scripts/test_reviewer_efficiency_contract.py
