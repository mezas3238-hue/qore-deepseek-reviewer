name: DeepSeek Harness Engineer auto dispatch

on:
  push:
    branches:
      - main
    paths:
      - harness_engineer_requests/current.json

permissions:
  actions: write
  contents: read

concurrency:
  group: deepseek-harness-engineer-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce Harness DeepSeek cost-window start gate
        id: cost_window
        run: |
          set -euo pipefail
          LOCAL_DATE="$(TZ=America/Asuncion date +%F)"
          LOCAL_TIME="$(TZ=America/Asuncion date +%H:%M:%S)"
          LOCAL_HHMM="$(TZ=America/Asuncion date +%H%M)"
          LAST_START_HHMM=1945
          echo "America/Asuncion local time: ${LOCAL_DATE} ${LOCAL_TIME}"
          if (( 10#$LOCAL_HHMM >= 10#$LAST_START_HHMM )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Harness DeepSeek dispatch DEFERRED: local time ${LOCAL_TIME} is at/after the 19:45 safe-start cutoff."
            echo "No DeepSeek workflow was launched. Preserve the request and dispatch/resume in the next permitted cost window."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Harness DeepSeek dispatch permitted before 19:45 America/Asuncion safe-start cutoff."
          fi

      - name: Validate immutable Engineer request and dispatch resilient workflow
        if: ${{ steps.cost_window.outputs.allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: harness_engineer_requests/current.json
          REQUEST_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VALIDATED="$(python3 scripts/harness_engineer_package_contract.py request "$REQUEST")"

          PACKAGE_ID="$(jq -r '.package_id' <<<"$VALIDATED")"
          EXPECTED_START="$(jq -r '.expected_start' <<<"$VALIDATED")"
          EXPECTED_TREE="$(jq -r '.expected_tree' <<<"$VALIDATED")"
          TASK_PATH="$(jq -r '.task_path' <<<"$VALIDATED")"
          MODE="$(jq -r '.mode' <<<"$VALIDATED")"
          DISPATCH_NONCE="$(jq -r '.dispatch_nonce' <<<"$VALIDATED")"
          ALLOWED_PATHS_JSON="$(jq -c '.allowed_paths' <<<"$VALIDATED")"
          MAX_CHANGED_FILES="$(jq -r '.max_changed_files' <<<"$VALIDATED")"
          MAX_DIFF_LINES="$(jq -r '.max_diff_lines' <<<"$VALIDATED")"
          RECOVERY_ARTIFACT_ID="$(jq -r '.recovery_artifact_id // 0' <<<"$VALIDATED")"
          RECOVERY_PATCH_SHA256="$(jq -r '.recovery_patch_sha256 // ""' <<<"$VALIDATED")"

          test -f "$TASK_PATH"

          if test "$RECOVERY_ARTIFACT_ID" != "0"; then
            test -n "$RECOVERY_PATCH_SHA256"
            test "${#RECOVERY_PATCH_SHA256}" -eq 64
          else
            test -z "$RECOVERY_PATCH_SHA256"
          fi

          for WORKFLOW in deepseek-harness-engineer.yml deepseek-harness-engineer-resilient.yml; do
            EXISTING="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
                --jq '.workflow_runs[].display_title' 2>/dev/null || true
            )"
            if grep -Fqx "DeepSeek Harness Engineer · ${PACKAGE_ID}" <<<"$EXISTING"; then
              echo "Refusing duplicate Harness Engineer dispatch for package ${PACKAGE_ID}; found in ${WORKFLOW}." >&2
              exit 1
            fi
          done

          gh workflow run deepseek-harness-engineer-resilient.yml \
            --ref main \
            -f "request_commit=${REQUEST_COMMIT}" \
            -f "package_id=${PACKAGE_ID}" \
            -f "expected_start=${EXPECTED_START}" \
            -f "expected_tree=${EXPECTED_TREE}" \
            -f "task_path=${TASK_PATH}" \
            -f "mode=${MODE}" \
            -f "dispatch_nonce=${DISPATCH_NONCE}" \
            -f "allowed_paths_json=${ALLOWED_PATHS_JSON}" \
            -f "max_changed_files=${MAX_CHANGED_FILES}" \
            -f "max_diff_lines=${MAX_DIFF_LINES}" \
            -f "recovery_artifact_id=${RECOVERY_ARTIFACT_ID}" \
            -f "recovery_patch_sha256=${RECOVERY_PATCH_SHA256}"

          echo "Resilient DeepSeek Harness Engineer dispatch accepted for ${PACKAGE_ID}."
